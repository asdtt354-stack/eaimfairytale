<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>나만의 동화책 제작 & 서재</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 720px; margin: 30px auto; padding: 20px; background: #f0f4f8; color: #333; }
    .card { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
    h2 { margin-top: 0; color: #2c3e50; font-size: 22px; text-align: center; }
    
    .tab-nav { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 2px solid #e5e7eb; padding-bottom: 8px; }
    .tab-btn { flex: 1; padding: 10px; background: none; border: none; font-size: 16px; font-weight: bold; color: #6b7280; cursor: pointer; border-radius: 8px; }
    .tab-btn.active { background: #e0e7ff; color: #4338ca; }

    /* API 키 상자 */
    .api-key-box { background: #eef2ff; border: 1px solid #c7d2fe; padding: 14px; border-radius: 10px; margin-bottom: 20px; }
    .api-key-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .api-key-header label { color: #3730a3; font-weight: bold; }
    .api-key-actions { display: flex; gap: 8px; align-items: center; }
    .api-status { font-size: 12px; color: #10b981; font-weight: bold; display: none; }
    .api-btn-small { background: #6366f1; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }
    .api-btn-clear { background: none; border: none; color: #ef4444; font-size: 11px; cursor: pointer; text-decoration: underline; }
    
    .input-group { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
    input, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; background: white; }
    input:focus, select:focus { outline: none; border-color: #6366f1; }
    
    button.primary-btn { width: 100%; padding: 14px; background: #6366f1; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button.primary-btn:hover { background: #4f46e5; }
    button.primary-btn:disabled { background: #a5b4fc; cursor: not-allowed; }
    
    #status-log { margin-top: 15px; font-size: 14px; color: #6366f1; text-align: center; font-weight: 600; }
    
    /* 📖 그림 위 텍스트 오버레이 동화책 뷰어 */
    #book-container { margin-top: 24px; display: none; }
    .story-title { font-size: 22px; font-weight: bold; color: #1e293b; text-align: center; margin-bottom: 16px; }
    
    .book-page-wrapper { width: 100%; position: relative; }
    .page-item { display: none; position: relative; width: 100%; max-width: 600px; aspect-ratio: 1/1; margin: 0 auto; border-radius: 18px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.12); animation: fadeIn 0.3s ease-in-out; background: #f3f4f6; }
    .page-item.active { display: block; }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    .page-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .page-loading-text { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; font-size: 16px; color: #6b7280; font-weight: 600; }

    .page-overlay-box { position: absolute; bottom: 0; left: 0; width: 100%; box-sizing: border-box; background: linear-gradient(to top, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.45) 75%, rgba(0,0,0,0) 100%); padding: 36px 22px 20px 22px; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
    .page-text { font-size: 16.5px; line-height: 1.8; color: #ffffff; text-align: left; word-break: keep-all; margin: 0; text-shadow: 0 2px 4px rgba(0,0,0,0.6); }
    .page-num-badge { display: inline-block; background: rgba(255, 255, 255, 0.25); color: #fff; padding: 2px 8px; border-radius: 6px; font-size: 13px; font-weight: bold; margin-bottom: 6px; border: 1px solid rgba(255,255,255,0.4); }

    .page-nav-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; background: #f8fafc; padding: 10px 16px; border-radius: 12px; border: 1px solid #e2e8f0; }
    .page-nav-btn { background: #3b82f6; color: white; border: none; padding: 8px 18px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    .page-nav-btn:hover { background: #2563eb; }
    .page-nav-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
    .page-indicator { font-size: 14.5px; font-weight: bold; color: #475569; }

    .controls { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .controls button { flex: 1; min-width: 90px; padding: 12px; background: #e5e7eb; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
    .controls button.read-btn { background: #10b981; color: white; flex-basis: 100%; font-size: 15px; }
    .controls button.read-btn:hover { background: #059669; }
    
    .controls button.loop-btn { background: #f3f4f6; color: #4b5563; border: 1px solid #d1d5db; }
    .controls button.loop-btn.active { background: #8b5cf6; color: white; border-color: #7c3aed; font-weight: bold; }
    
    .controls button.save-btn { background: #4f46e5; color: white; }
    .controls button.pdf-btn { background: #f59e0b; color: white; }
    .controls button.stop { background: #fee2e2; color: #991b1b; }

    .library-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .library-play-all { background: #3b82f6; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
    .library-item { display: flex; justify-content: space-between; align-items: center; padding: 14px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; margin-bottom: 10px; }
    .library-info { flex: 1; text-align: left; }
    .library-info h4 { margin: 0 0 4px 0; color: #1f2937; }
    .library-info p { margin: 0; font-size: 12px; color: #6b7280; }
    .library-actions { display: flex; gap: 6px; }
    .library-actions button { padding: 6px 10px; font-size: 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
    .btn-load { background: #6366f1; color: white; }
    .btn-delete { background: #ef4444; color: white; }
  </style>
</head>
<body>

<div class="card">
  <h2>📖 나만의 동화책 제작 & 서재</h2>

  <div class="tab-nav">
    <button class="tab-btn active" id="tabCreateBtn" onclick="switchTab('create')">✍️ 새 동화 만들기</button>
    <button class="tab-btn" id="tabLibraryBtn" onclick="switchTab('library')">📚 내 서재 보관함</button>
  </div>

  <div id="create-view">
    <!-- API 키 설정 영역 (이중 저장 지원) -->
    <div class="api-key-box">
      <div class="api-key-header">
        <label for="apiKey">🔑 Google AI Studio API Key</label>
        <div class="api-key-actions">
          <span class="api-status" id="apiStatus">💾 저장됨</span>
          <button class="api-btn-small" onclick="saveApiKeyManually()">키 저장</button>
          <button class="api-btn-clear" onclick="clearSavedApiKey()">삭제</button>
        </div>
      </div>
      <input type="password" id="apiKey" placeholder="API 키를 입력하세요" onchange="saveApiKeyManually()" oninput="handleKeyTyping()">
    </div>
    
    <div class="input-group">
      <label>주인공</label>
      <input type="text" id="character" value="호기심 많은 아기 고양이 나비">
    </div>
    <div class="input-group">
      <label>배경</label>
      <input type="text" id="background" value="구름 위에 떠 있는 무지개 마을">
    </div>
    <div class="input-group">
      <label>교훈 / 주제</label>
      <input type="text" id="lesson" value="실수를 두려워하지 않고 다시 도전하는 용기">
    </div>
    
    <div class="input-group">
      <label for="storyLength">⏱ 이야기 분량</label>
      <select id="storyLength">
        <option value="2">2분 (약 4페이지)</option>
        <option value="3" selected>3분 (약 6페이지)</option>
        <option value="5">5분 (약 8페이지)</option>
        <option value="10">10분 (약 10페이지)</option>
      </select>
    </div>

    <div class="input-group">
      <label for="voiceStyle">🎙 낭독 목소리 선택</label>
      <select id="voiceStyle">
        <option value="warm_mom" selected>🌸 다정한 이야기 엄마 / 이모 (따뜻하고 편안한 톤)</option>
        <option value="cheerful_kid">🧒 발랄한 어린이 친구 (밝고 쾌활한 모험 톤)</option>
        <option value="wise_grandpa">🧙‍♂️ 지혜로운 마법사 할아버지 (차분하고 묵직한 저음)</option>
        <option value="pro_actor">🎭 감정 풍부한 동화 구연 성우 (생동감 넘치는 표준 톤)</option>
      </select>
    </div>

    <button class="primary-btn" id="generateBtn" onclick="generateStoryAndImages()">🎨 동화 & 삽화 제작하기</button>
    <div id="status-log"></div>
  </div>

  <div id="library-view" style="display: none;">
    <div class="library-header">
      <span style="font-weight: bold; color: #4b5563;">보관된 동화 목록</span>
      <button class="library-play-all" onclick="playAllBooksSequentially()">▶ 서재 전체 연속 재생</button>
    </div>
    <div id="library-list">
      <p style="text-align: center; color: #6b7280;">저장된 동화책이 없습니다.</p>
    </div>
  </div>

  <div id="book-container">
    <div class="story-title" id="story-main-title"></div>
    
    <div class="book-page-wrapper" id="story-pages-wrapper"></div>

    <div class="page-nav-bar">
      <button class="page-nav-btn" id="prevPageBtn" onclick="goToPrevPage()">◀ 이전 페이지</button>
      <span class="page-indicator" id="pageIndicator">1 / 1</span>
      <button class="page-nav-btn" id="nextPageBtn" onclick="goToNextPage()">다음 페이지 ▶</button>
    </div>
  </div>
  
  <div class="controls" id="controlPanel" style="display: none;">
    <button class="read-btn" id="readBtn" onclick="startContinuousReading()">📢 동화 낭독하기</button>
    <button class="loop-btn" id="loopBtn" onclick="toggleRepeatMode()">🔁 반복 재생: OFF</button>
    <button onclick="pauseVoice()">⏸ 일시정지</button>
    <button onclick="resumeVoice()">▶ 이어듣기</button>
    <button class="stop" onclick="stopVoice()">⏹ 정지</button>
    <button class="save-btn" onclick="saveCurrentStoryToDB()">💾 내 서재에 저장</button>
    <button class="pdf-btn" onclick="exportToPDF()">📄 PDF 다운로드</button>
  </div>
</div>

<script>
  let currentStoryBookObject = null;
  let db;
  let isPlaying = false;
  let isRepeatMode = false;
  let isLibraryPlayingMode = false;
  let allLibraryBooks = [];
  let currentLibraryIndex = 0;
  let currentPageIndex = 0;

  let availableVoices = [];
  function initVoices() {
    availableVoices = window.speechSynthesis.getVoices();
  }
  if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = initVoices;
  }
  initVoices();

  // --- 💡 [핵심] API 키 이중 저장소 (localStorage + IndexedDB 설정 테이블) ---
  const API_STORAGE_KEY = "gemini_fairytale_api_key";

  function handleKeyTyping() {
    saveApiKeyManually();
  }

  function saveApiKeyManually() {
    const key = document.getElementById('apiKey').value.trim();
    if (!key) return;

    // 1. localStorage에 저장
    try {
      localStorage.setItem(API_STORAGE_KEY, key);
    } catch(e) {}

    // 2. IndexedDB 환경설정 테이블에 이중 백업 저장
    if (db) {
      try {
        const tx = db.transaction("settings", "readwrite");
        tx.objectStore("settings").put({ key: "apiKey", value: key });
      } catch(e) {}
    }

    // 상태 표시 애니메이션
    const status = document.getElementById('apiStatus');
    status.style.display = 'inline';
    setTimeout(() => { status.style.display = 'none'; }, 2000);
  }

  function clearSavedApiKey() {
    try { localStorage.removeItem(API_STORAGE_KEY); } catch(e) {}
    if (db) {
      try {
        const tx = db.transaction("settings", "readwrite");
        tx.objectStore("settings").delete("apiKey");
      } catch(e) {}
    }
    document.getElementById('apiKey').value = '';
    alert('저장된 API 키가 삭제되었습니다.');
  }

  // --- DB 초기화 및 키 복원 ---
  const dbRequest = indexedDB.open("FairytaleAppDB", 2); // 버전 2 (설정 스토어 추가)
  dbRequest.onupgradeneeded = (e) => {
    db = e.target.result;
    if (!db.objectStoreNames.contains("books")) {
      db.createObjectStore("books", { keyPath: "id", autoIncrement: true });
    }
    if (!db.objectStoreNames.contains("settings")) {
      db.createObjectStore("settings", { keyPath: "key" });
    }
  };
  dbRequest.onsuccess = (e) => {
    db = e.target.result;
    loadLibraryList();

    // 1차: localStorage에서 키 복원
    let loadedKey = "";
    try { loadedKey = localStorage.getItem(API_STORAGE_KEY); } catch(e) {}

    if (loadedKey) {
      document.getElementById('apiKey').value = loadedKey;
    } else {
      // 2차: IndexedDB에서 백업 키 복원
      const tx = db.transaction("settings", "readonly");
      const req = tx.objectStore("settings").get("apiKey");
      req.onsuccess = () => {
        if (req.result && req.result.value) {
          document.getElementById('apiKey').value = req.result.value;
        }
      };
    }
  };

  const lengthConfig = {
    "2": { pages: 4, charCountPerPage: "150~180자 (4~5문장)" },
    "3": { pages: 6, charCountPerPage: "160~200자 (5~6문장)" },
    "5": { pages: 8, charCountPerPage: "200~250자 (6~7문장)" },
    "10": { pages: 10, charCountPerPage: "280~320자 (8~10문장)" }
  };

  // 1. 스토리 & 삽화 생성
  async function generateStoryAndImages() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const char = document.getElementById('character').value.trim();
    const bg = document.getElementById('background').value.trim();
    const lesson = document.getElementById('lesson').value.trim();
    const lengthVal = document.getElementById('storyLength').value;
    const btn = document.getElementById('generateBtn');
    const statusLog = document.getElementById('status-log');
    const bookContainer = document.getElementById('book-container');
    const pagesWrapper = document.getElementById('story-pages-wrapper');
    const controlPanel = document.getElementById('controlPanel');

    if (!apiKey) {
      alert('API 키를 입력해 주세요.');
      document.getElementById('apiKey').focus();
      return;
    }

    saveApiKeyManually(); // 생성 시 확실하게 저장

    const config = lengthConfig[lengthVal];
    btn.disabled = true;
    controlPanel.style.display = 'none';
    bookContainer.style.display = 'none';
    statusLog.innerText = `1/${config.pages + 1}. 스토리를 구성 중입니다...`;
    pagesWrapper.innerHTML = '';
    stopVoice();

    const promptText = `
너는 유아/아동용 그림동화 전문 작가야.
아래 설정을 바탕으로 총 ${config.pages}개 장면에 걸친 ${lengthVal}분 분량의 동화책 JSON 데이터를 만들어줘.

- 주인공: ${char}
- 배경: ${bg}
- 주제/교훈: ${lesson}

[작성 가이드라인]
1. 등장인물의 대화, 감정 표현, 구체적인 상황 묘사를 충분히 넣어줘.
2. 각 페이지당 한국어 본문 길이는 반드시 **${config.charCountPerPage}** 내외로 작성해줘.
3. 아동용 친근한 구어체('~했어요', '~했답니다') 사용.

[반드시 준수할 출력 규격: 순수 JSON만 출력]
{
  "title": "동화책 제목",
  "pages": [
    {
      "page_num": 1,
      "text": "1페이지 상세 본문...",
      "image_prompt": "1페이지 장면에 어울리는 구체적인 영문 프롬프트, cute soft watercolor children's book illustration style, bright, pastel colors"
    }
  ]
}
`;

    try {
      const geminiRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: promptText }] }],
          generationConfig: { responseMimeType: "application/json" }
        })
      });

      const geminiData = await geminiRes.json();
      if (geminiData.error) throw new Error(geminiData.error.message);

      const storyData = JSON.parse(geminiData.candidates[0].content.parts[0].text);
      currentStoryBookObject = {
        title: storyData.title,
        createdAt: new Date().toLocaleString(),
        pages: []
      };

      document.getElementById('story-main-title').innerText = `📖 ${storyData.title}`;
      bookContainer.style.display = 'block';

      for (let i = 0; i < storyData.pages.length; i++) {
        const page = storyData.pages[i];
        statusLog.innerText = `${i + 2}/${storyData.pages.length + 1}. ${page.page_num}페이지 삽화를 그리는 중... (${i + 1}/${storyData.pages.length})`;

        let imgBase64 = "";
        try {
          imgBase64 = await generateGeminiImage(apiKey, page.image_prompt);
        } catch (imgErr) {
          console.error(`Page ${i+1} Image Error:`, imgErr);
        }

        currentStoryBookObject.pages.push({
          page_num: page.page_num,
          text: page.text,
          imageBase64: imgBase64
        });
      }

      renderBookPages(currentStoryBookObject);
      showPage(0);

      statusLog.innerText = '✅ 동화책이 완성되었습니다! 책장을 넘기거나 낭독을 시작해 보세요.';
      controlPanel.style.display = 'flex';

    } catch (err) {
      statusLog.innerText = `⚠️ 오류: ${err.message}`;
    } finally {
      btn.disabled = false;
    }
  }

  async function generateGeminiImage(apiKey, prompt) {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image:generateContent?key=${apiKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: `Children's storybook illustration: ${prompt}` }] }]
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const parts = data.candidates?.[0]?.content?.parts || [];
    for (const part of parts) {
      if (part.inlineData && part.inlineData.data) return part.inlineData.data;
    }
    throw new Error('이미지 없음');
  }

  // 2. 뷰어 렌더링
  function renderBookPages(book) {
    const wrapper = document.getElementById('story-pages-wrapper');
    wrapper.innerHTML = '';

    book.pages.forEach((p, i) => {
      const pageDiv = document.createElement('div');
      pageDiv.className = `page-item ${i === 0 ? 'active' : ''}`;
      pageDiv.id = `book-page-${i}`;
      
      const imgHtml = p.imageBase64 
        ? `<img src="data:image/png;base64,${p.imageBase64}" class="page-img" alt="삽화 ${p.page_num}">` 
        : `<div class="page-loading-text">🎨 (삽화 없음)</div>`;

      pageDiv.innerHTML = `
        ${imgHtml}
        <div class="page-overlay-box">
          <div class="page-num-badge">${p.page_num}페이지</div>
          <p class="page-text">${p.text}</p>
        </div>
      `;
      wrapper.appendChild(pageDiv);
    });

    document.getElementById('story-main-title').innerText = `📖 ${book.title}`;
    document.getElementById('book-container').style.display = 'block';
    document.getElementById('controlPanel').style.display = 'flex';
  }

  function showPage(index) {
    if (!currentStoryBookObject || !currentStoryBookObject.pages.length) return;
    
    const total = currentStoryBookObject.pages.length;
    if (index < 0) index = 0;
    if (index >= total) index = total - 1;
    
    currentPageIndex = index;

    document.querySelectorAll('.page-item').forEach((el, i) => {
      if (i === currentPageIndex) el.classList.add('active');
      else el.classList.remove('active');
    });

    document.getElementById('pageIndicator').innerText = `${currentPageIndex + 1} / ${total} 페이지`;
    document.getElementById('prevPageBtn').disabled = (currentPageIndex === 0);
    document.getElementById('nextPageBtn').disabled = (currentPageIndex === total - 1);
  }

  function goToPrevPage() { showPage(currentPageIndex - 1); }
  function goToNextPage() { showPage(currentPageIndex + 1); }

  // 3. 목소리 매핑 & 낭독 엔진
  async function startContinuousReading(onCompleteCallback = null) {
    if (!currentStoryBookObject) return;
    stopVoice();
    isPlaying = true;

    showPage(0);
    await readSingleSnippet(`제목: ${currentStoryBookObject.title}`);

    for (let i = 0; i < currentStoryBookObject.pages.length; i++) {
      if (!isPlaying) break;
      showPage(i);
      const pageText = currentStoryBookObject.pages[i].text;
      await readSingleSnippet(pageText);
    }

    if (isPlaying) {
      if (onCompleteCallback && typeof onCompleteCallback === 'function') {
        onCompleteCallback();
      } else if (isRepeatMode) {
        setTimeout(() => {
          if (isPlaying && isRepeatMode) {
            startContinuousReading();
          }
        }, 1500);
      } else {
        isPlaying = false;
      }
    }
  }

  function readSingleSnippet(text) {
    return new Promise((resolve) => {
      const cleanText = text.replace(/[*#]/g, '');
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'ko-KR';

      const voiceStyle = document.getElementById('voiceStyle').value;
      
      switch (voiceStyle) {
        case 'cheerful_kid':
          utterance.rate = 1.05;
          utterance.pitch = 1.35;
          break;
        case 'wise_grandpa':
          utterance.rate = 0.78;
          utterance.pitch = 0.65;
          break;
        case 'pro_actor':
          utterance.rate = 0.92;
          utterance.pitch = 1.15;
          break;
        case 'warm_mom':
        default:
          utterance.rate = 0.86;
          utterance.pitch = 1.08;
          break;
      }

      if (availableVoices.length === 0) initVoices();
      const koVoices = availableVoices.filter(v => v.lang.startsWith('ko'));
      if (koVoices.length > 0) {
        if (voiceStyle === 'wise_grandpa') {
          const maleVoice = koVoices.find(v => v.name.includes('Male') || v.name.includes('남성') || v.name.includes('Minho'));
          if (maleVoice) utterance.voice = maleVoice;
          else utterance.voice = koVoices[0];
        } else {
          const femaleVoice = koVoices.find(v => v.name.includes('Female') || v.name.includes('여성') || v.name.includes('Yuna') || v.name.includes('Sora') || v.name.includes('Google'));
          if (femaleVoice) utterance.voice = femaleVoice;
          else utterance.voice = koVoices[0];
        }
      }

      utterance.onend = () => resolve();
      utterance.onerror = () => resolve();

      window.speechSynthesis.speak(utterance);
    });
  }

  function toggleRepeatMode() {
    isRepeatMode = !isRepeatMode;
    const loopBtn = document.getElementById('loopBtn');
    if (isRepeatMode) {
      loopBtn.classList.add('active');
      loopBtn.innerText = '🔁 반복 재생: ON';
    } else {
      loopBtn.classList.remove('active');
      loopBtn.innerText = '🔁 반복 재생: OFF';
    }
  }

  // 4. 서재 전체 재생
  async function playAllBooksSequentially() {
    if (allLibraryBooks.length === 0) {
      alert('서재에 저장된 책이 없습니다.');
      return;
    }
    isLibraryPlayingMode = true;
    currentLibraryIndex = 0;
    playNextBookInLibrary();
  }

  function playNextBookInLibrary() {
    if (!isPlaying && currentLibraryIndex > 0) return;

    if (currentLibraryIndex >= allLibraryBooks.length) {
      if (isRepeatMode) {
        currentLibraryIndex = 0;
      } else {
        alert('📚 서재의 모든 동화책 연속 재생이 완료되었습니다!');
        isLibraryPlayingMode = false;
        isPlaying = false;
        return;
      }
    }

    const nextBook = allLibraryBooks[currentLibraryIndex];
    currentStoryBookObject = nextBook;
    renderBookPages(nextBook);
    showPage(0);
    switchTab('create');

    setTimeout(() => {
      startContinuousReading(() => {
        currentLibraryIndex++;
        playNextBookInLibrary();
      });
    }, 1000);
  }

  // 5. 서재 관리
  function saveCurrentStoryToDB() {
    if (!currentStoryBookObject) return;
    const tx = db.transaction("books", "readwrite");
    const store = tx.objectStore("books");
    store.add(currentStoryBookObject);
    tx.oncomplete = () => {
      alert(`[${currentStoryBookObject.title}]이(가) 내 서재에 저장되었습니다!`);
      loadLibraryList();
    };
  }

  function loadLibraryList() {
    if (!db) return;
    const tx = db.transaction("books", "readonly");
    const store = tx.objectStore("books");
    const req = store.getAll();
    const listEl = document.getElementById("library-list");

    req.onsuccess = () => {
      allLibraryBooks = req.result;
      if (allLibraryBooks.length === 0) {
        listEl.innerHTML = `<p style="text-align: center; color: #6b7280;">저장된 동화책이 없습니다.</p>`;
        return;
      }
      listEl.innerHTML = allLibraryBooks.map((book) => `
        <div class="library-item">
          <div class="library-info">
            <h4>📖 ${book.title}</h4>
            <p>생성일: ${book.createdAt} (총 ${book.pages.length}페이지)</p>
          </div>
          <div class="library-actions">
            <button class="btn-load" onclick="loadSingleBook(${book.id})">열기</button>
            <button class="btn-delete" onclick="deleteSavedBook(${book.id})">삭제</button>
          </div>
        </div>
      `).join('');
    };
  }

  function loadSingleBook(id) {
    const tx = db.transaction("books", "readonly");
    const req = tx.objectStore("books").get(id);
    req.onsuccess = () => {
      const book = req.result;
      currentStoryBookObject = book;
      renderBookPages(book);
      showPage(0);
      switchTab('create');
    };
  }

  function deleteSavedBook(id) {
    if (!confirm('이 동화책을 서재에서 삭제하시겠습니까?')) return;
    const tx = db.transaction("books", "readwrite");
    tx.objectStore("books").delete(id);
    tx.oncomplete = () => loadLibraryList();
  }

  // 6. PDF 다운로드
  function exportToPDF() {
    if (!currentStoryBookObject) return;
    
    const printContainer = document.createElement('div');
    printContainer.innerHTML = `<h1 style="text-align:center; font-size:24px; margin-bottom:24px; color:#1e293b;">📖 ${currentStoryBookObject.title}</h1>`;
    
    currentStoryBookObject.pages.forEach(p => {
      const pDiv = document.createElement('div');
      pDiv.style.cssText = "page-break-inside: avoid; position: relative; width: 100%; max-width: 520px; aspect-ratio: 1/1; margin: 0 auto 30px auto; border-radius: 12px; overflow: hidden;";
      const imgTag = p.imageBase64 ? `<img src="data:image/png;base64,${p.imageBase64}" style="width: 100%; height: 100%; object-fit: cover;">` : '';
      pDiv.innerHTML = `
        ${imgTag}
        <div style="position: absolute; bottom: 0; left: 0; width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.65); padding: 20px 16px; color: #fff;">
          <b style="color: #fbbf24;">[${p.page_num}페이지]</b>
          <p style="font-size: 14px; line-height: 1.6; margin: 4px 0 0 0; color: #fff;">${p.text}</p>
        </div>
      `;
      printContainer.appendChild(pDiv);
    });

    const opt = {
      margin: 10,
      filename: `${currentStoryBookObject.title}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };
    html2pdf().set(opt).from(printContainer).save();
  }

  function switchTab(tab) {
    document.getElementById('create-view').style.display = tab === 'create' ? 'block' : 'none';
    document.getElementById('library-view').style.display = tab === 'library' ? 'block' : 'none';
    document.getElementById('tabCreateBtn').className = `tab-btn ${tab === 'create' ? 'active' : ''}`;
    document.getElementById('tabLibraryBtn').className = `tab-btn ${tab === 'library' ? 'active' : ''}`;
    if (tab === 'library') loadLibraryList();
  }

  function pauseVoice() { window.speechSynthesis.pause(); }
  function resumeVoice() { window.speechSynthesis.resume(); }
  function stopVoice() {
    isPlaying = false;
    isLibraryPlayingMode = false;
    window.speechSynthesis.cancel();
  }
</script>
