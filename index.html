<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>뮤니의 동화마을 이야기</title>
  <!-- PDF 변환 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    html {
      scroll-behavior: smooth;
    }

    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; 
      margin: 0;
      padding: 12px 10px;
      background: radial-gradient(circle at 50% 10%, #fff1f2 0%, #e0e7ff 45%, #fef3c7 100%);
      background-attachment: fixed;
      color: #334155; 
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    
    .card { 
      width: 100%;
      max-width: 640px;
      background: linear-gradient(180deg, #ffffff 0%, #fff7ed 40%, #fdf2f8 80%, #ffffff 100%);
      backdrop-filter: blur(12px);
      padding: 14px 16px 20px 16px;
      border-radius: 28px; 
      box-shadow: 0 16px 36px rgba(244, 114, 182, 0.16), 0 4px 12px rgba(0,0,0,0.04); 
      border: 2.5px solid #fde68a;
      margin: 0 auto;
      position: relative;
    }

    /* 🎵 둥실둥실 파티클 */
    .particle-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 200px;
      pointer-events: none !important;
      z-index: 1;
    }

    .sparkle {
      position: absolute;
      font-size: 16px;
      opacity: 0.65;
      user-select: none;
      pointer-events: none !important;
      animation: floatSparkle 3s ease-in-out infinite alternate;
    }

    .sp1 { top: 12px; left: 16%; animation-delay: 0s; font-size: 18px; }
    .sp2 { top: 38px; right: 15%; animation-delay: 0.7s; font-size: 20px; }
    .sp3 { top: 80px; left: 8%; animation-delay: 1.4s; font-size: 15px; }
    .sp4 { top: 75px; right: 8%; animation-delay: 0.4s; font-size: 17px; }
    .sp5 { top: 110px; left: 20%; animation-delay: 1.8s; font-size: 14px; }
    .sp6 { top: 115px; right: 20%; animation-delay: 1.1s; font-size: 16px; }

    @keyframes floatSparkle {
      0% { transform: translateY(0px) scale(0.96) rotate(-3deg); opacity: 0.45; }
      50% { transform: translateY(-4px) scale(1.05) rotate(5deg); opacity: 0.75; }
      100% { transform: translateY(-2px) scale(1) rotate(-1deg); opacity: 0.55; }
    }

    .muni-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      text-align: center;
      position: relative;
      z-index: 2;
      pointer-events: none;
    }

    .muni-full-banner-wrap {
      width: 100%;
      max-width: 470px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 4px auto 8px auto;
      pointer-events: none;
      min-height: 150px;
    }

    .muni-full-banner {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 6px 14px rgba(244, 114, 182, 0.28));
      pointer-events: none;
    }

    .muni-subtitle {
      font-size: 13.5px;
      font-weight: 800;
      margin: 2px 0 12px 0;
      position: relative;
      z-index: 2;
      letter-spacing: -0.3px;
      background: linear-gradient(90deg, #7c3aed, #db2777);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      pointer-events: none;
    }

    /* 🎧 BGM 미니 컨트롤러 바 */
    .bgm-control-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fdf4ff;
      border: 1.5px solid #f5d0fe;
      padding: 8px 12px;
      border-radius: 14px;
      margin-bottom: 14px;
      position: relative;
      z-index: 5;
    }
    .bgm-info { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #86198f; }
    .bgm-actions { display: flex; align-items: center; gap: 8px; }
    
    .bgm-switch-btn { 
      background: linear-gradient(135deg, #d946ef 0%, #a855f7 100%); 
      color: white; 
      border: none; 
      padding: 6px 12px; 
      border-radius: 8px; 
      font-size: 12px; 
      font-weight: 800; 
      cursor: pointer; 
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .bgm-switch-btn.off { background: #e2e8f0; color: #64748b; }
    .bgm-slider { width: 65px; accent-color: #d946ef; cursor: pointer; }
    
    .tab-nav { 
      display: flex; 
      gap: 6px; 
      margin-bottom: 16px;
      background: #f1f5f9;
      padding: 5px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      position: relative;
      z-index: 5;
    }
    .tab-btn { 
      flex: 1; 
      padding: 11px; 
      background: transparent; 
      border: none; 
      font-size: 14.5px; 
      font-weight: 800; 
      color: #64748b; 
      cursor: pointer; 
      border-radius: 12px; 
      transition: all 0.2s ease;
    }
    .tab-btn.active { 
      background: #ffffff; 
      color: #6366f1; 
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.12); 
    }

    .user-profile-box { 
      background: #ffffff; 
      border: 1.5px dashed #cbd5e1; 
      padding: 14px; 
      border-radius: 16px; 
      margin-bottom: 16px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      position: relative;
      z-index: 5;
    }
    .user-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .user-header label { color: #4f46e5; font-weight: 700; font-size: 13.5px; }
    .user-actions { display: flex; gap: 6px; align-items: center; }
    .user-status { font-size: 12px; color: #10b981; font-weight: bold; display: none; }
    .btn-small { background: #6366f1; color: white; border: none; padding: 5px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 600; }
    .btn-clear { background: none; border: none; color: #ef4444; font-size: 12px; cursor: pointer; text-decoration: underline; }
    
    .helper-text { font-size: 12px; color: #64748b; margin-top: 4px; line-height: 1.4; }
    .helper-alert { color: #4f46e5; font-weight: 600; }

    .input-group { margin-bottom: 15px; position: relative; z-index: 5; }
    label { display: block; font-weight: 700; margin-bottom: 5px; font-size: 14px; color: #334155; }
    input, select { 
      width: 100%; 
      padding: 12px 14px; 
      border: 1.5px solid #e2e8f0; 
      border-radius: 12px; 
      font-size: 15px; 
      background: #ffffff; 
      transition: all 0.2s;
    }
    input:focus, select:focus { 
      outline: none; 
      border-color: #6366f1; 
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12); 
    }
    
    .photo-upload-box {
      background: #fffbeb;
      border: 2px dashed #fcd34d;
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      margin-bottom: 16px;
      position: relative;
      z-index: 5;
    }
    .photo-preview-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 8px;
    }
    .photo-preview-img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #f59e0b;
      display: none;
    }
    .photo-btn {
      background: #f59e0b;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .photo-clear-btn {
      background: #fee2e2;
      color: #991b1b;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      display: none;
    }

    .primary-btn { 
      width: 100%; 
      padding: 16px; 
      background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%); 
      color: white; 
      border: none; 
      border-radius: 16px; 
      font-size: 17px; 
      font-weight: 800; 
      cursor: pointer !important; 
      margin-top: 10px; 
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
      position: relative;
      z-index: 50 !important;
      display: block;
      text-align: center;
      user-select: none;
      touch-action: manipulation;
    }
    .primary-btn:active { 
      transform: scale(0.96); 
      background: linear-gradient(135deg, #4f46e5 0%, #db2777 100%);
    }
    
    #status-log { 
      margin-top: 14px; 
      font-size: 14.5px; 
      color: #4f46e5; 
      text-align: center; 
      font-weight: 700; 
      position: relative;
      z-index: 5;
      line-height: 1.5;
    }
    
    #book-container { 
      margin-top: 24px; 
      display: none; 
      position: relative; 
      z-index: 5; 
      padding-top: 10px;
      border-top: 2px dashed #fcd34d;
    }
    .story-title { font-size: 21px; font-weight: 800; color: #1e293b; text-align: center; margin-bottom: 14px; }
    
    .book-page-wrapper { width: 100%; position: relative; }
    .page-item { display: none; position: relative; width: 100%; aspect-ratio: 1/1; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.12); animation: fadeIn 0.3s ease-in-out; background: #e2e8f0; border: 3px solid #ffffff; }
    .page-item.active { display: block; }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    .page-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .page-loading-text { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; font-size: 15px; color: #64748b; font-weight: 700; }

    .page-overlay-box { 
      position: absolute; 
      bottom: 0; 
      left: 0; 
      width: 100%; 
      background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.65) 75%, rgba(0,0,0,0) 100%); 
      padding: 34px 16px 16px 16px; 
      backdrop-filter: blur(4px); 
      -webkit-backdrop-filter: blur(4px); 
      max-height: 55%;
      overflow-y: auto;
    }
    .page-text { font-size: 14.5px; line-height: 1.7; color: #ffffff; text-align: left; word-break: keep-all; margin: 0; text-shadow: 0 2px 4px rgba(0,0,0,0.7); font-weight: 500; }
    .page-num-badge { display: inline-block; background: rgba(251, 191, 36, 0.95); color: #78350f; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 800; margin-bottom: 6px; }

    .dialogue-char { font-weight: 800; margin-right: 4px; }
    .dialogue-hero { color: #93c5fd; }
    .dialogue-villain { color: #f87171; }
    .dialogue-elder { color: #fde047; }
    .emotion-tag { font-size: 11px; padding: 1px 5px; border-radius: 4px; background: rgba(255,255,255,0.2); color: #fff; margin-left: 4px; font-weight: normal; }

    .page-nav-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; background: #f8fafc; padding: 10px 14px; border-radius: 12px; border: 1.5px solid #e2e8f0; }
    .page-nav-btn { background: #3b82f6; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-size: 13.5px; font-weight: 700; cursor: pointer; }
    .page-nav-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
    .page-indicator { font-size: 14px; font-weight: 800; color: #475569; }

    .drama-control-box {
      margin-top: 14px;
      background: #eff6ff;
      border: 1.5px solid #bfdbfe;
      padding: 12px 14px;
      border-radius: 12px;
    }
    .drama-control-box label { color: #1e40af; font-size: 13.5px; margin-bottom: 6px; }

    .controls { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; position: relative; z-index: 5; }
    .controls button { flex: 1 1 calc(50% - 4px); padding: 12px 6px; background: #e2e8f0; border: none; border-radius: 10px; font-size: 13.5px; cursor: pointer; font-weight: 700; color: #334155; }
    .controls button.read-btn { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; flex: 1 1 100%; font-size: 15.5px; padding: 13px; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25); }
    
    .controls button.bgm-btn { background: #fdf4ff; color: #86198f; border: 1.5px solid #f5d0fe; }
    .controls button.bgm-btn.off { background: #f1f5f9; color: #94a3b8; border-color: #cbd5e1; }

    .controls button.loop-btn { background: #f1f5f9; color: #475569; border: 1.5px solid #cbd5e1; }
    .controls button.loop-btn.active { background: #8b5cf6; color: white; border-color: #7c3aed; font-weight: 800; }
    
    .controls button.save-btn { background: #6366f1; color: white; }
    .controls button.pdf-btn { background: #f59e0b; color: white; }
    .controls button.stop { background: #fee2e2; color: #991b1b; }

    .library-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .library-play-all { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .library-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: #ffffff; border: 1.5px solid #e2e8f0; border-radius: 12px; margin-bottom: 10px; }
    .library-info { flex: 1; text-align: left; }
    .library-info h4 { margin: 0 0 3px 0; color: #1e293b; font-size: 15px; font-weight: 700; }
    .library-info p { margin: 0; font-size: 11.5px; color: #64748b; }
    .library-actions { display: flex; gap: 6px; }
    .library-actions button { padding: 6px 10px; font-size: 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: 700; }
    .btn-load { background: #6366f1; color: white; }
    .btn-delete { background: #ef4444; color: white; }
  </style>
</head>

  <!-- 🎧 상단 BGM 바 -->
  <div class="bgm-control-bar">
    <div class="bgm-info">
      <span id="bgmIcon">🎵</span>
      <span id="bgmTitleText">배경음악: 환상 판타지 오르골</span>
    </div>
    <div class="bgm-actions">
      <input type="range" class="bgm-slider" id="bgmVolumeSlider" min="0" max="1" step="0.05" value="0.25" oninput="changeBgmVolume(this.value)">

  <div class="tab-nav">
    <button type="button" class="tab-btn active" id="tabCreateBtn" onclick="switchTab('create')">✨ 새 동화 만들기</button>

  </div>

  <!-- 1. 제작 탭 -->
  <div id="create-view">
    <div class="user-profile-box">
      <div class="user-header">
        <label for="apiKey">🔑 API Key & 내 서재 닉네임</label>
        <div class="user-actions">
          <span class="user-status" id="apiStatus">💾 저장됨</span>
          <button type="button" class="btn-small" onclick="saveUserSession()">설정 저장</button>
          <button type="button" class="btn-clear" onclick="clearUserSession()">초기화</button>
        </div>
      </div>
      <input type="password" id="apiKey" placeholder="Google AI Studio API 키를 입력하세요" oninput="saveUserSession()" style="margin-bottom: 8px;">
      
      <label for="authorName" style="font-size: 13px; color: #334155; margin-top: 6px;">✍️ 책 저장을 위한 작가 닉네임 (필수)</label>
      <input type="text" id="authorName" placeholder="책 저장을 위해 닉네임을 적어주세요 (예: 민우 작가, 3학년 2반)" oninput="saveUserSession()">
      <div class="helper-text">
        <span class="helper-alert">💡 안내:</span> 같은 기기나 API 키를 함께 써도, <b>닉네임(이름)</b>을 적어주시면 나만의 서재에 따로 안전하게 보관됩니다.
      </div>
    </div>

    <!-- 📸 얼굴 사진 업로드 -->
    <div class="photo-upload-box">
      <label style="color: #92400e; margin-bottom: 4px;">🧒 주인공 얼굴 사진 넣기 (선택)</label>
      <p style="margin: 0 0 8px 0; font-size: 12px; color: #b45309;">아이 사진을 넣으면 동화 속 캐릭터로 쏙 들어갑니다!</p>
      <input type="file" id="childPhotoInput" accept="image/*" style="display: none;" onchange="handlePhotoUpload(event)">
      <div class="photo-preview-wrapper">
        <img id="photoPreview" class="photo-preview-img" alt="아이 사진">
        <button type="button" class="photo-btn" onclick="document.getElementById('childPhotoInput').click()">📷 사진 선택하기</button>
        <button type="button" id="photoClearBtn" class="photo-clear-btn" onclick="clearChildPhoto()">지우기</button>
      </div>
    </div>

    <!-- 🎭 장르 선택 -->
    <div class="input-group">
      <label for="storyGenre">🎨 동화 장르 / 이야기 스타일</label>
      <select id="storyGenre" onchange="handleGenreChange(this.value)">
        <option value="fantasy" selected>✨ 환상 판타지 / 요정 이야기 (마법, 신비로운 모험)</option>
        <option value="heroic">⚔️ 영웅 & 신화 / 성경 / 역사 모험 (용기와 믿음의 대결)</option>
        <option value="mystery">🔍 흥미진진 추리 & 비밀 탐험 (지혜로운 수수께끼 풀기)</option>
        <option value="scifi">🚀 우주 & 미래 SF 과학 탐험 (로봇, 별자리, 시간여행)</option>
        <option value="animal">🐾 따뜻한 동물 친구들 & 일상 교훈 (숲속 우정과 배려)</option>
        <option value="comic">😂 유쾌하고 웃긴 코믹 모험 (엉뚱하고 재미있는 소동)</option>
        <option value="custom">🌈 기타 / 자유 장르 (주제에 맞춘 창의적 자유 연출)</option>
      </select>
    </div>
    
    <div class="input-group">
      <label for="character">🐰 등장인물 / 주인공 이름</label>
      <input type="text" id="character" placeholder="비워두시면 뮤니가 멋진 주인공을 만들어줘요! (예: 꼬마 토끼, 우주비행사)">
    </div>
    <div class="input-group">
      <label for="background">🏰 배경</label>
      <input type="text" id="background" placeholder="비워두시면 신비로운 장소로 자동 생성돼요! (예: 은하수 별나라, 무지개 숲)">
    </div>
    <div class="input-group">
      <label for="lesson">💡 교훈 / 주제</label>
      <input type="text" id="lesson" placeholder="비워두시면 따뜻한 감동 이야기로 만들어줘요! (예: 진정한 용기, 나눔의 행복)">
    </div>
    
    <div class="input-group">
      <label for="storyLength">⏱ 동화 구연 시간을 선택해주세요</label>
      <select id="storyLength">
        <option value="2">2분 동화 (약 4페이지 - 속도감 있는 역할극)</option>
        <option value="3" selected>3분 동화 (약 6페이지 - 대화가 풍성한 오디오 드라마)</option>
        <option value="5">5분 동화 (약 8페이지 - 깊이 있는 모험 서사극)</option>
        <option value="10">10분 동화 (약 10페이지 - 장편 입체 낭독극)</option>
      </select>
      <div class="helper-text">💡 원하는 낭독 길이에 맞춰 이야기와 삽화 페이지 수를 조절합니다.</div>
    </div>

    <!-- 💡 [메인 액션 버튼] -->
    <button type="button" class="primary-btn" id="generateBtn" onclick="generateStoryAndImages()">🎭 뮤니와 함께 동화책 만들기</button>
    <div id="status-log"></div>
  </div>

  <!-- 2. 서재 탭 -->
  <div id="library-view" style="display: none; position: relative; z-index: 5;">
    <div class="library-header">

<script>
  let currentStoryBookObject = null;
  let db = null;
  let isPlaying = false;
  let isRepeatMode = false;
  let isLibraryPlayingMode = false;
  let myLibraryBooks = [];
  let currentLibraryIndex = 0;
  let currentPageIndex = 0;

  let childPhotoBase64 = null;
  let childPhotoMime = "image/jpeg";

  // 🎵 --- BGM 오디오 엔진 ---
  let bgmAudio = new Audio();
  bgmAudio.loop = true;
  let isBgmEnabled = true;
  let targetBgmVolume = 0.25;

  const bgmPlaylist = {
    "fantasy": { name: "환상 판타지 오르골", url: "https://cdn.pixabay.com/download/audio/2022/05/16/audio_db6591201e.mp3?filename=fairytale-112349.mp3" },
    "heroic": { name: "웅장한 영웅 서사곡", url: "https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3?filename=cinematic-atmosphere-score-2-22136.mp3" },
    "mystery": { name: "비밀 탐험 수수께끼", url: "https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=mystery-10825.mp3" },
    "scifi": { name: "신비로운 우주 유영", url: "https://cdn.pixabay.com/download/audio/2022/03/24/audio_33890b0be9.mp3?filename=space-ambience-5627.mp3" },

  function handleGenreChange(genreKey) {
    updateBgmGenrePreview(genreKey);
  }

  function updateBgmGenrePreview(genreKey) {
    const bgmData = bgmPlaylist[genreKey] || bgmPlaylist["fantasy"];
    const textEl = document.getElementById('bgmTitleText');
    if (textEl) textEl.innerText = `배경음악: ${bgmData.name}`;
    bgmAudio.src = bgmData.url;
  }

  function playBgmForCurrentStory() {
    if (!isBgmEnabled) return;
    const genreKey = (currentStoryBookObject && currentStoryBookObject.genre) || document.getElementById('storyGenre').value;
    const bgmData = bgmPlaylist[genreKey] || bgmPlaylist["fantasy"];
    if (bgmAudio.src !== bgmData.url) {
      bgmAudio.src = bgmData.url;
    }
    bgmAudio.volume = targetBgmVolume;
    bgmAudio.play().catch(e => console.log("BGM 재생 대기:", e));
  }

  function stopBgm() {
    bgmAudio.pause();
    bgmAudio.currentTime = 0;
  }

  function toggleBgmSound() {
    isBgmEnabled = !isBgmEnabled;
    const topBtn = document.getElementById('bgmSwitchTopBtn');
    const bottomBtn = document.getElementById('bgmControlBtn');
    const icon = document.getElementById('bgmIcon');

    if (isBgmEnabled) {
      if (topBtn) { topBtn.className = "bgm-switch-btn"; topBtn.innerText = "🎵 BGM: ON"; }
      if (bottomBtn) { bottomBtn.className = "bgm-btn"; bottomBtn.innerText = "🎵 배경음악: ON"; }
      if (icon) icon.innerText = "🎵";
      if (isPlaying) playBgmForCurrentStory();
    } else {
      if (topBtn) { topBtn.className = "bgm-switch-btn off"; topBtn.innerText = "🔇 BGM: OFF"; }
      if (bottomBtn) { bottomBtn.className = "bgm-btn off"; bottomBtn.innerText = "🔇 배경음악: OFF"; }
      if (icon) icon.innerText = "🔇";
      bgmAudio.pause();
    }
  }

  function changeBgmVolume(val) {
    targetBgmVolume = parseFloat(val);
    bgmAudio.volume = targetBgmVolume;
  }

  // 💡 [모바일 음성 합성 엔진 안정화]
  // iOS Safari / Android Chrome에서 Web Speech API가 늦게 준비되거나
  // cancel 직후 무음 상태가 되는 문제를 줄이기 위한 상태값입니다.
  let availableVoices = [];
  let currentUtterance = null;
  let speechSessionId = 0;
  let speechWatchdog = null;
  let isSpeechPaused = false;

  function initVoices() {
    if (typeof window.speechSynthesis === 'undefined') return;
    const voices = window.speechSynthesis.getVoices();
    if (voices && voices.length) availableVoices = voices;
  }

  if (typeof window.speechSynthesis !== 'undefined') {
    initVoices();
    if ('onvoiceschanged' in window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = initVoices;
    }
    // 일부 모바일 브라우저는 첫 getVoices()가 빈 배열을 반환합니다.
    setTimeout(initVoices, 250);
    setTimeout(initVoices, 1000);
  }

  function clearSpeechWatchdog() {
    if (speechWatchdog) {
      clearInterval(speechWatchdog);
      speechWatchdog = null;
    }
  }

  function safeCancelSpeech() {
    if (typeof window.speechSynthesis === 'undefined') return;
    clearSpeechWatchdog();
    try {
      // pause 상태에서 cancel만 하면 iOS가 다음 speak를 무시하는 경우가 있어
      // 먼저 resume 한 뒤 cancel 합니다.
      window.speechSynthesis.resume();
      window.speechSynthesis.cancel();
    } catch (e) {
      console.log('speech cancel notice:', e);
    }
    currentUtterance = null;
    isSpeechPaused = false;
  }

  // BGM만 사용자 터치로 미리 활성화합니다.
  // 음성합성에 빈 문장을 speak()하지 않습니다. (iOS 무음 원인 가능)
  function unlockMobileAudio() {
    if (!bgmAudio) return;
    const oldVolume = bgmAudio.volume;
    bgmAudio.volume = 0;
    const p = bgmAudio.play();
    if (p && typeof p.then === 'function') {
      p.then(() => {
        bgmAudio.pause();
        bgmAudio.currentTime = 0;
        bgmAudio.volume = oldVolume || targetBgmVolume;
      }).catch(() => {
        bgmAudio.volume = oldVolume || targetBgmVolume;
      });
    }
  }

  // 💡 [동화 제작 함수]

      if (statusLog) statusLog.innerText = `✨ 1/${config.pages + 1}. [${author}] 작가님의 맞춤 입체 대본을 작성 중입니다...`;
      if (pagesWrapper) pagesWrapper.innerHTML = '';
      stopVoice();

      const promptText = `
너는 유명 성우들이 연기할 역동적이고 재미있는 '어린이 오디오 드라마' 극작가야.

[작성 규칙]
1. 재미있고 통통 튀는 대사와 해설이 어우러진 대본 형태로 작성해줘.
2. 각 페이지의 dialogue_list 배열에 문장 단위로 role과 emotion을 반드시 부여해줘:
   - role: "narrator", "hero", "villain", "elder", "friend"
   - emotion: "excited", "happy", "urgent", "angry", "curious", "whisper", "calm"
3. full_text에는 전체 본문을 적어줘.
4. image_prompt에는 장르 화풍('${selectedGenre.artStyle}')을 반영한 영문 프롬프트를 작성해줘.

[출력 규격: 순수 JSON만 출력]
{
  "title": "동화책 제목",
  "pages": [
    {
      "page_num": 1,
      "full_text": "전체 본문",
      "dialogue_list": [
        { "role": "narrator", "emotion": "excited", "text": "문장..." },

      ],
      "image_prompt": "1페이지 영문 프롬프트, ${selectedGenre.artStyle}"
    }
  ]
}
`;

      const geminiRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: promptText }] }],
          generationConfig: { responseMimeType: "application/json" }
        })
      });

      const geminiData = await geminiRes.json();
      if (geminiData.error) throw new Error(geminiData.error.message);

      const storyData = JSON.parse(geminiData.candidates[0].content.parts[0].text);
      
      currentStoryBookObject = {
        userId: getUniqueUserIdentifier(),
        author: author,

  async function generateGeminiImage(apiKey, prompt, inputImageBase64 = null) {
    const parts = [];

    if (inputImageBase64) {
      parts.push({
        inlineData: {
          mimeType: childPhotoMime,
          data: inputImageBase64
        }
      });
      parts.push({
        text: `Create a children's book illustration where the main character has the exact facial appearance, hairstyle, and likeness of the child in the provided image. Scene description: ${prompt}`
      });
    } else {
      parts.push({
        text: `Children's storybook illustration: ${prompt}`
      });
    }

    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image:generateContent?key=${apiKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts: parts }] })
    });

    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const resParts = data.candidates?.[0]?.content?.parts || [];
    for (const part of resParts) {
      if (part.inlineData && part.inlineData.data) return part.inlineData.data;
    }
    throw new Error('이미지 없음');
  }

  function getUniqueUserIdentifier() {
    const key = (document.getElementById('apiKey')?.value || '').trim();
    const author = (document.getElementById('authorName')?.value || '').trim();
    if (key.length >= 8) {
      return (author ? author + "_" : "user_") + key.slice(-8);
    }
    return author ? author : "default_guest";
  }

  function saveUserSession() {
    try {
      const key = (document.getElementById('apiKey')?.value || '').trim();
      const author = (document.getElementById('authorName')?.value || '').trim();
      localStorage.setItem("gemini_fairytale_api_key", key);
      localStorage.setItem("gemini_fairytale_author", author);
      const status = document.getElementById('apiStatus');
      if (status) {
        status.style.display = 'inline';
        setTimeout(() => { status.style.display = 'none'; }, 1500);
      }

    loadLibraryList();
  }

  function clearUserSession() {
    try {
      localStorage.removeItem("gemini_fairytale_api_key");
      localStorage.removeItem("gemini_fairytale_author");
    } catch(e) {}
    const k = document.getElementById('apiKey');
    const a = document.getElementById('authorName');

    if (a) a.value = '';

    alert('사용자 정보가 초기화되었습니다.');

      dbRequest.onupgradeneeded = (e) => {
        db = e.target.result;
        if (!db.objectStoreNames.contains("books")) {
          const store = db.createObjectStore("books", { keyPath: "id", autoIncrement: true });
          store.createIndex("userId", "userId", { unique: false });
        }
      };
      dbRequest.onsuccess = (e) => {
        db = e.target.result;
        try {
          const savedKey = localStorage.getItem("gemini_fairytale_api_key");

          if (savedAuthor && document.getElementById('authorName')) document.getElementById('authorName').value = savedAuthor;
        } catch(e) {}
        loadLibraryList();
      };
    }
  } catch(e) {
    console.log("DB Init Notice:", e);
  }

  function handlePhotoUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    childPhotoMime = file.type || "image/jpeg";
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const maxDim = 512;
        let w = img.width, h = img.height;
        if (w > h && w > maxDim) { h *= maxDim / w; w = maxDim; }
        else if (h > maxDim) { w *= maxDim / h; h = maxDim; }
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);

        const dataUrl = canvas.toDataURL(childPhotoMime, 0.85);
        childPhotoBase64 = dataUrl.split(',')[1];

        const preview = document.getElementById('photoPreview');
        if (preview) {
          preview.src = dataUrl;
          preview.style.display = 'block';
        }
        const clearBtn = document.getElementById('photoClearBtn');
        if (clearBtn) clearBtn.style.display = 'inline-block';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

      artStyle: "cute fluffy animal characters, warm cozy forest background, soft watercolor picture book style"
    },
    "comic": {
      storyGuide: "엉뚱하고 기발한 사건, 유쾌한 소동, 아이들이 까르르 웃을 수 있는 재치 넘치는 대화로 연출해줘.",
      artStyle: "fun lively children's comic storybook illustration, expressive characters, bright cheerful vibrant colors"
    },
    "custom": {
      storyGuide: "입력된 주인공과 배경, 주제의 개성을 극대화하여 가장 매력적이고 독창적인 맞춤형 스토리로 자유롭게 연출해줘.",
      artStyle: "creative charming children's storybook illustration, expressive and heartwarming watercolor art style, vibrant pleasant colors"
    }
  };

  function renderBookPages(book) {
    const wrapper = document.getElementById('story-pages-wrapper');
    if (!wrapper) return;
    wrapper.innerHTML = '';

    book.pages.forEach((p, i) => {
      const pageDiv = document.createElement('div');
      pageDiv.className = `page-item ${i === 0 ? 'active' : ''}`;
      pageDiv.id = `book-page-${i}`;
      
      const imgHtml = p.imageBase64 
        ? `<img src="data:image/png;base64,${p.imageBase64}" class="page-img" alt="삽화 ${p.page_num}">` 
        : `<div class="page-loading-text">🎨 (삽화 준비 중)</div>`;

      const formattedText = p.dialogue_list 
        ? p.dialogue_list.map(d => {
            let icon = '📖';
            let roleClass = '';
            if (d.role === 'hero' || d.role === 'child') { icon = '🧒'; roleClass = 'dialogue-hero'; }
            else if (d.role === 'villain' || d.role === 'monster') { icon = '👹'; roleClass = 'dialogue-villain'; }
            else if (d.role === 'elder') { icon = '🧙‍♂️'; roleClass = 'dialogue-elder'; }
            else if (d.role === 'friend') { icon = '🐾'; roleClass = 'dialogue-hero'; }

            let emotionBadge = '';
            if (d.emotion === 'excited') emotionBadge = '<span class="emotion-tag">✨ 신남</span>';
            else if (d.emotion === 'urgent') emotionBadge = '<span class="emotion-tag">🔥 긴박</span>';
            else if (d.emotion === 'angry') emotionBadge = '<span class="emotion-tag">💥 호통</span>';
            else if (d.emotion === 'whisper') emotionBadge = '<span class="emotion-tag">🤫 속삭임</span>';

            if (d.role === 'narrator') {
              return `${d.text}<br>`;
            } else {
              return `<span class="dialogue-char ${roleClass}">${icon}</span> "${d.text}" ${emotionBadge}<br>`;
            }
          }).join('')
        : p.full_text;

      pageDiv.innerHTML = `
        ${imgHtml}
        <div class="page-overlay-box">
          <div class="page-num-badge">${p.page_num}페이지</div>
          <p class="page-text">${formattedText}</p>
        </div>
      `;
      wrapper.appendChild(pageDiv);
    });

    const titleEl = document.getElementById('story-main-title');
    if (titleEl) titleEl.innerText = `📖 ${book.title}`;
    const bookContainer = document.getElementById('book-container');
    if (bookContainer) bookContainer.style.display = 'block';
    const controlPanel = document.getElementById('controlPanel');
    if (controlPanel) controlPanel.style.display = 'flex';
  }

  function showPage(index) {
    if (!currentStoryBookObject || !currentStoryBookObject.pages.length) return;
    const total = currentStoryBookObject.pages.length;
    if (index < 0) index = 0;
    if (index >= total) index = total - 1;
    currentPageIndex = index;

    document.querySelectorAll('.page-item').forEach((el, i) => {
      if (i === currentPageIndex) el.classList.add('active');
      else el.classList.remove('active');
    });

    const ind = document.getElementById('pageIndicator');
    if (ind) ind.innerText = `${currentPageIndex + 1} / ${total}`;
    const prev = document.getElementById('prevPageBtn');
    if (prev) prev.disabled = (currentPageIndex === 0);
    const next = document.getElementById('nextPageBtn');
    if (next) next.disabled = (currentPageIndex === total - 1);
  }

  function goToPrevPage() { 
    if (isPlaying) stopVoice();
    showPage(currentPageIndex - 1); 
  }
  function goToNextPage() { 
    if (isPlaying) stopVoice();
    showPage(currentPageIndex + 1); 
  }

  // 💡 [모바일 안정형 연속 낭독 루프]
  async function startContinuousReading(onCompleteCallback = null) {
    if (!currentStoryBookObject) return;

    if (typeof window.speechSynthesis === 'undefined' || typeof SpeechSynthesisUtterance === 'undefined') {
      alert('이 브라우저는 음성 낭독 기능을 지원하지 않습니다. Safari 또는 Chrome 최신 버전으로 열어주세요.');
      return;
    }

    // 중요: 예전 코드는 unlockMobileAudio() 직후 stopVoice()가 speak()를 cancel하여
    // 모바일에서 첫 낭독이 사라질 수 있었습니다. 이제 기존 음성을 먼저 정리합니다.
    speechSessionId += 1;
    const mySession = speechSessionId;
    safeCancelSpeech();
    initVoices();

    isPlaying = true;
    isSpeechPaused = false;
    showPage(0);

    // 첫 문장은 반드시 '낭독 시작' 버튼의 사용자 제스처 흐름에서 바로 speak 합니다.
    // BGM은 음성이 실제 시작된 뒤 켭니다.
    const firstOk = await speakDynamicLine(
      'narrator',
      'excited',
      `제목: ${currentStoryBookObject.title}`,
      { sessionId: mySession, startBgmOnStart: true }
    );

    if (!firstOk || !isPlaying || mySession !== speechSessionId) return;

    for (let i = 0; i < currentStoryBookObject.pages.length; i++) {
      if (!isPlaying || mySession !== speechSessionId) break;
      showPage(i);

      const pageData = currentStoryBookObject.pages[i];

      if (pageData.dialogue_list && pageData.dialogue_list.length > 0) {
        for (const line of pageData.dialogue_list) {
          if (!isPlaying || mySession !== speechSessionId) break;
          const ok = await speakDynamicLine(
            line.role || 'narrator',
            line.emotion || 'calm',
            line.text,
            { sessionId: mySession }
          );
          if (!ok || !isPlaying || mySession !== speechSessionId) break;
          const delay = line.emotion === 'urgent' ? 100 : 160;
          await new Promise(r => setTimeout(r, delay));
        }
      } else {
        const ok = await speakDynamicLine(
          'narrator',
          'calm',
          pageData.full_text,
          { sessionId: mySession }
        );
        if (!ok || !isPlaying || mySession !== speechSessionId) break;
      }
    }

    if (isPlaying && mySession === speechSessionId) {
      if (onCompleteCallback && typeof onCompleteCallback === 'function') {
        onCompleteCallback();
      } else if (isRepeatMode) {
        setTimeout(() => {
          if (isPlaying && isRepeatMode && mySession === speechSessionId) {
            startContinuousReading();
          }
        }, 700);
      } else {
        isPlaying = false;
        clearSpeechWatchdog();
        stopBgm();
      }
    }
  }

  // 💡 [모바일 안정형 단일 발화 함수]
  function speakDynamicLine(role, emotion, rawText, options = {}) {
    return new Promise((resolve) => {
      if (typeof window.speechSynthesis === 'undefined' || typeof SpeechSynthesisUtterance === 'undefined') {
        resolve(false);
        return;
      }

      const cleanText = String(rawText || '').replace(/[*#"]/g, '').trim();
      if (!cleanText) { resolve(true); return; }

      const sessionId = options.sessionId ?? speechSessionId;
      if (!isPlaying || sessionId !== speechSessionId) { resolve(false); return; }

      initVoices();

      const utterance = new SpeechSynthesisUtterance(cleanText);
      currentUtterance = utterance; // iOS에서 GC로 발화가 끊기는 문제 방지
      utterance.lang = 'ko-KR';
      utterance.volume = 1;

      const styleEl = document.getElementById('actingStyle');
      const styleMode = styleEl ? styleEl.value : 'dynamic_theater';

      const koVoices = availableVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith('ko'));
      const maleVoice = koVoices.find(v => /male|남성|minho|standard-c/i.test(v.name));
      const femaleVoice = koVoices.find(v => /female|여성|yuna|sora|heami|google/i.test(v.name));
      const defaultVoice = femaleVoice || koVoices[0] || null;

      const r = (role || '').toLowerCase();
      const em = (emotion || '').toLowerCase();
      let rate = 1.0;
      let pitch = 1.0;

      if (styleMode === 'dynamic_theater') {
        if (r.includes('hero') || r.includes('child') || r.includes('friend')) {
          if (femaleVoice) utterance.voice = femaleVoice;
          else if (defaultVoice) utterance.voice = defaultVoice;
          if (em === 'excited' || em === 'happy') { rate = 1.06; pitch = 1.08; }
          else if (em === 'urgent') { rate = 1.10; pitch = 1.05; }
          else if (em === 'whisper') { rate = 0.94; pitch = 1.02; }
          else { rate = 1.02; pitch = 1.05; }
        } else if (r.includes('villain') || r.includes('monster') || r.includes('giant')) {
          if (maleVoice) utterance.voice = maleVoice;
          else if (defaultVoice) utterance.voice = defaultVoice;
          if (em === 'angry') { rate = 1.02; pitch = 0.92; }
          else { rate = 0.96; pitch = 0.94; }
        } else if (r.includes('elder') || r.includes('king')) {
          if (maleVoice) utterance.voice = maleVoice;
          else if (defaultVoice) utterance.voice = defaultVoice;
          rate = 0.95; pitch = 0.96;
        } else {
          if (femaleVoice) utterance.voice = femaleVoice;
          else if (defaultVoice) utterance.voice = defaultVoice;
          if (em === 'excited') { rate = 1.04; pitch = 1.04; }
        }
      } else {
        rate = 0.92; pitch = 0.98;
        if ((r.includes('villain') || r.includes('elder')) && maleVoice) utterance.voice = maleVoice;
        else if (femaleVoice) utterance.voice = femaleVoice;
        else if (defaultVoice) utterance.voice = defaultVoice;
      }

      utterance.rate = rate;
      utterance.pitch = pitch;

      let finished = false;
      let started = false;
      let hardTimeout = null;

      const finish = (ok = true) => {
        if (finished) return;
        finished = true;
        if (hardTimeout) clearTimeout(hardTimeout);
        clearSpeechWatchdog();
        if (currentUtterance === utterance) currentUtterance = null;
        if (isBgmEnabled && bgmAudio && !bgmAudio.paused) {
          bgmAudio.volume = targetBgmVolume;
        }
        resolve(ok);
      };

      utterance.onstart = () => {
        started = true;
        if (options.startBgmOnStart && isBgmEnabled) {
          playBgmForCurrentStory();
        }
        if (isBgmEnabled && bgmAudio && !bgmAudio.paused) {
          bgmAudio.volume = targetBgmVolume * 0.35;
        }

        // Chrome 계열의 장문 발화가 멈추는 현상 완화.
        clearSpeechWatchdog();
        speechWatchdog = setInterval(() => {
          if (!isPlaying || sessionId !== speechSessionId || isSpeechPaused) return;
          try { window.speechSynthesis.resume(); } catch (e) {}
        }, 4000);
      };

      utterance.onend = () => finish(true);
      utterance.onerror = (event) => {
        console.warn('Speech synthesis error:', event && event.error ? event.error : event);
        // cancel/interrupted는 사용자가 정지한 경우가 많으므로 재생 종료로 처리
        const err = event && event.error ? event.error : '';
        if (err === 'canceled' || err === 'interrupted') finish(false);
        else finish(false);
      };

      // 12초 고정 타임아웃은 긴 문장을 중간에 넘겨버릴 수 있었습니다.
      // 문장 길이에 따라 충분히 기다리고, 정말 멈춘 경우에만 다음으로 진행합니다.
      const estimatedMs = Math.max(18000, Math.min(90000, cleanText.length * 420));
      hardTimeout = setTimeout(() => {
        if (!finished) {
          console.warn('Speech watchdog timeout. started=', started, 'text=', cleanText.slice(0, 30));
          try { window.speechSynthesis.cancel(); } catch (e) {}
          finish(false);
        }
      }, estimatedMs);

      try {
        // iOS에서 pause 상태가 남아 있으면 speak()가 무음이 될 수 있습니다.
        window.speechSynthesis.resume();
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.error('speechSynthesis.speak failed:', e);
        finish(false);
      }
    });
  }

  function toggleRepeatMode() {
    isRepeatMode = !isRepeatMode;
    const loopBtn = document.getElementById('loopBtn');
    if (loopBtn) {
      if (isRepeatMode) {
        loopBtn.classList.add('active');
        loopBtn.innerText = '🔁 반복 재생: ON';
      } else {
        loopBtn.classList.remove('active');
        loopBtn.innerText = '🔁 반복 재생: OFF';
      }
    }
  }

  async function playAllBooksSequentially() {
    if (myLibraryBooks.length === 0) {
      alert('내 서재에 저장된 동화책이 없습니다.');
      return;
    }
    isLibraryPlayingMode = true;
    currentLibraryIndex = 0;
    playNextBookInLibrary();
  }

  function playNextBookInLibrary() {
    if (!isPlaying && currentLibraryIndex > 0) return;

    if (currentLibraryIndex >= myLibraryBooks.length) {
      if (isRepeatMode) {
        currentLibraryIndex = 0;
      } else {
        alert('📚 내 서재의 모든 동화책 연속 재생이 완료되었습니다!');
        isLibraryPlayingMode = false;
        isPlaying = false;
        stopBgm();
        return;
      }
    }

    const nextBook = myLibraryBooks[currentLibraryIndex];
    currentStoryBookObject = nextBook;
    renderBookPages(nextBook);
    showPage(0);
    switchTab('create');

    // 첫 책은 사용자의 '연속 재생' 터치 흐름을 유지한 채 바로 낭독을 시작합니다.
    // iOS Safari는 setTimeout 뒤의 최초 speak()를 사용자 제스처로 인정하지 않을 수 있습니다.
    startContinuousReading(() => {
      currentLibraryIndex++;
      playNextBookInLibrary();
    });
  }

  function saveCurrentStoryToDB() {
    if (!currentStoryBookObject || !db) return;
    
    currentStoryBookObject.userId = getUniqueUserIdentifier();
    currentStoryBookObject.author = (document.getElementById('authorName')?.value || '').trim() || "꼬마 작가";
    currentStoryBookObject.genre = document.getElementById('storyGenre')?.value || "fantasy";

    try {
      const tx = db.transaction("books", "readwrite");
      const store = tx.objectStore("books");
      store.add(currentStoryBookObject);
      tx.oncomplete = () => {
        alert(`[${currentStoryBookObject.title}]이(가) [${currentStoryBookObject.author}] 님의 서재에 안전하게 저장되었습니다!`);
        loadLibraryList();
      };
    } catch(e) {
      alert('서재 저장 중 오류가 발생했습니다.');
    }
  }

  function loadLibraryList() {
    if (!db) return;
    try {
      const currentUserId = getUniqueUserIdentifier();
      const authorName = (document.getElementById('authorName')?.value || '').trim() || "나";
      
      const titleEl = document.getElementById('libraryTitleLabel');
      if (titleEl) titleEl.innerText = `📚 [${authorName}] 작가님의 서재`;

      const tx = db.transaction("books", "readonly");
      const store = tx.objectStore("books");
      const req = store.getAll();
      const listEl = document.getElementById("library-list");

      req.onsuccess = () => {
        const allBooks = req.result;
        myLibraryBooks = allBooks.filter(book => book.userId === currentUserId || !book.userId);

        if (!listEl) return;
        if (myLibraryBooks.length === 0) {
          listEl.innerHTML = `<p style="text-align: center; color: #94a3b8; padding: 20px;">[${authorName}] 님의 서재에 보관된 동화책이 없습니다.</p>`;
          return;
        }

        listEl.innerHTML = myLibraryBooks.map((book) => `
          <div class="library-item">
            <div class="library-info">
              <h4>📖 ${book.title}</h4>
              <p>작가: <b>${book.author || '익명'}</b> | 저장일: ${book.createdAt} (총 ${book.pages.length}p)</p>
            </div>
            <div class="library-actions">
              <button type="button" class="btn-load" onclick="loadSingleBook(${book.id})">열기</button>
              <button type="button" class="btn-delete" onclick="deleteSavedBook(${book.id})">삭제</button>
            </div>
          </div>
        `).join('');
      };
    } catch(e) {}
  }

  function loadSingleBook(id) {
    if (!db) return;
    try {
      const tx = db.transaction("books", "readonly");
      const req = tx.objectStore("books").get(id);
      req.onsuccess = () => {
        const book = req.result;
        currentStoryBookObject = book;
        renderBookPages(book);
        showPage(0);
        switchTab('create');
        updateBgmGenrePreview(book.genre || "fantasy");
        
        setTimeout(() => {
          const bookView = document.getElementById('book-container');
          if (bookView) bookView.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 200);
      };
    } catch(e) {}
  }

  function deleteSavedBook(id) {
    if (!db) return;
    if (!confirm('이 동화책을 내 서재에서 삭제하시겠습니까?')) return;
    try {
      const tx = db.transaction("books", "readwrite");
      tx.objectStore("books").delete(id);
      tx.oncomplete = () => loadLibraryList();
    } catch(e) {}
  }

  function exportToPDF() {
    if (!currentStoryBookObject) return;
    
    const printContainer = document.createElement('div');
    printContainer.innerHTML = `
      <h1 style="text-align:center; font-size:24px; margin-bottom:6px; color:#1e293b;">📖 ${currentStoryBookObject.title}</h1>
      <p style="text-align:center; font-size:14px; color:#64748b; margin-bottom:24px;">글/그림: ${currentStoryBookObject.author || '어린이 작가'}</p>
    `;
    
    currentStoryBookObject.pages.forEach(p => {
      const pDiv = document.createElement('div');
      pDiv.style.cssText = "page-break-inside: avoid; position: relative; width: 100%; max-width: 520px; aspect-ratio: 1/1; margin: 0 auto 30px auto; border-radius: 12px; overflow: hidden;";
      const imgTag = p.imageBase64 ? `<img src="data:image/png;base64,${p.imageBase64}" style="width: 100%; height: 100%; object-fit: cover;">` : '';
      pDiv.innerHTML = `
        ${imgTag}
        <div style="position: absolute; bottom: 0; left: 0; width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.65); padding: 20px 16px; color: #fff;">
          <b style="color: #fbbf24;">[${p.page_num}페이지]</b>
          <p style="font-size: 14px; line-height: 1.6; margin: 4px 0 0 0; color: #fff;">${p.full_text || p.text}</p>
        </div>
      `;
      printContainer.appendChild(pDiv);
    });

    const opt = {
      margin: 10,
      filename: `${currentStoryBookObject.title}_${currentStoryBookObject.author || '동화'}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };
    html2pdf().set(opt).from(printContainer).save();
  }

  function switchTab(tab) {
    const cv = document.getElementById('create-view');
    const lv = document.getElementById('library-view');
    const tbC = document.getElementById('tabCreateBtn');
    const tbL = document.getElementById('tabLibraryBtn');

    if (cv) cv.style.display = tab === 'create' ? 'block' : 'none';
    if (lv) lv.style.display = tab === 'library' ? 'block' : 'none';
    if (tbC) tbC.className = `tab-btn ${tab === 'create' ? 'active' : ''}`;
    if (tbL) tbL.className = `tab-btn ${tab === 'library' ? 'active' : ''}`;
    if (tab === 'library') loadLibraryList();
  }

  function pauseVoice() {
    isSpeechPaused = true;
    if (typeof window.speechSynthesis !== 'undefined') {
      try { window.speechSynthesis.pause(); } catch (e) {}
    }
    if (bgmAudio) bgmAudio.pause();
  }

  function resumeVoice() {
    isSpeechPaused = false;
    if (typeof window.speechSynthesis !== 'undefined') {
      try { window.speechSynthesis.resume(); } catch (e) {}
    }
    if (isBgmEnabled && bgmAudio && isPlaying) {
      bgmAudio.volume = currentUtterance ? targetBgmVolume * 0.35 : targetBgmVolume;
      const p = bgmAudio.play();
      if (p && typeof p.catch === 'function') p.catch(() => {});
    }
  }

  function stopVoice() {
    isPlaying = false;
    isLibraryPlayingMode = false;
    isSpeechPaused = false;
    speechSessionId += 1; // 진행 중인 async 낭독 루프 즉시 무효화
    safeCancelSpeech();
    stopBgm();
  }
</script>
