<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Gemini 3 Flash 동화책 낭독기</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 640px; margin: 30px auto; padding: 20px; background: #f5f7fb; color: #333; }
    .card { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
    h2 { margin-top: 0; color: #2c3e50; font-size: 22px; }
    
    .api-key-box { background: #eef2ff; border: 1px solid #c7d2fe; padding: 14px; border-radius: 10px; margin-bottom: 20px; }
    .api-key-box label { color: #3730a3; font-weight: bold; }
    
    .input-group { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
    input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; }
    input:focus { outline: none; border-color: #6366f1; }
    
    button.primary-btn { width: 100%; padding: 14px; background: #6366f1; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
    button.primary-btn:hover { background: #4f46e5; }
    button.primary-btn:disabled { background: #a5b4fc; cursor: not-allowed; }
    
    #story-viewer { margin-top: 24px; padding: 20px; background: #fffbeb; border: 1px solid #fef3c7; border-radius: 12px; min-height: 140px; font-size: 17px; line-height: 1.7; white-space: pre-line; }
    
    .controls { display: flex; gap: 10px; margin-top: 14px; }
    .controls button { flex: 1; padding: 10px; background: #e5e7eb; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600; }
    .controls button.stop { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

<div class="card">
  <h2>📖 Gemini 3 Flash AI 동화책 생성기</h2>

  <div class="api-key-box">
    <label for="apiKey">🔑 Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="AI Studio에서 발급받은 API 키를 입력하세요" style="margin-top: 6px;">
  </div>
  
  <div class="input-group">
    <label>주인공</label>
    <input type="text" id="character" value="호기심 많은 아기 고양이 나비">
  </div>
  <div class="input-group">
    <label>배경</label>
    <input type="text" id="background" value="구름 위에 떠 있는 무지개 마을">
  </div>
  <div class="input-group">
    <label>교훈 / 주제</label>
    <input type="text" id="lesson" value="실수를 두려워하지 않고 다시 도전하는 용기">
  </div>

  <button class="primary-btn" id="generateBtn" onclick="generateAndReadStory()">✨ 동화 생성 & 낭독 시작</button>

  <div id="story-viewer">
    <div id="story-content">설정을 입력하고 생성 버튼을 누르면 Gemini 3 Flash가 동화를 짓고 소리 내어 읽어줍니다.</div>
  </div>
  
  <div class="controls">
    <button onclick="pauseVoice()">⏸ 일시정지</button>
    <button onclick="resumeVoice()">▶ 이어듣기</button>
    <button class="stop" onclick="stopVoice()">⏹ 정지</button>
  </div>
</div>

<script>
  async function generateAndReadStory() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const char = document.getElementById('character').value.trim();
    const bg = document.getElementById('background').value.trim();
    const lesson = document.getElementById('lesson').value.trim();
    const btn = document.getElementById('generateBtn');
    const viewer = document.getElementById('story-content');

    if (!apiKey) {
      alert('Gemini API 키를 먼저 입력해 주세요.');
      document.getElementById('apiKey').focus();
      return;
    }

    btn.disabled = true;
    btn.innerText = '동화 작성 중...';
    viewer.innerText = 'Gemini 3 Flash 모델이 이야기를 만들고 있습니다...';
    stopVoice();

    const promptText = `
너는 유아/아동용 동화 작가야.
아래 설정을 바탕으로 4개 문단(기승전결)의 짧고 교훈적인 한국어 동화를 작성해줘.

- 주인공: ${char}
- 배경: ${bg}
- 주제/교훈: ${lesson}

반드시 어린이에게 읽어주기 좋은 다정하고 부드러운 구어체('~했어요', '~했답니다')로 작성해줘.
출력 형식은 첫 줄에 [제목: 동화제목], 그 다음 줄부터 본문 내용만 작성해.
`;

    try {
      // Gemini 3 Flash Preview 엔드포인트 적용
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: promptText }] }]
        })
      });

      const data = await response.json();
      
      if (data.error) {
        throw new Error(data.error.message || 'API 호출에 실패했습니다.');
      }

      const generatedStory = data.candidates[0].content.parts[0].text;
      viewer.innerText = generatedStory;

      speakStory(generatedStory);

    } catch (err) {
      viewer.innerText = `⚠️ 오류가 발생했습니다: ${err.message}`;
    } finally {
      btn.disabled = false;
      btn.innerText = '✨ 동화 생성 & 낭독 시작';
    }
  }

  function speakStory(text) {
    window.speechSynthesis.cancel();

    const cleanText = text.replace(/[*#]/g, '');
    const utterance = new SpeechSynthesisUtterance(cleanText);
    utterance.lang = 'ko-KR';
    utterance.rate = 0.88;
    utterance.pitch = 1.1;

    window.speechSynthesis.speak(utterance);
  }

  function pauseVoice() {
    window.speechSynthesis.pause();
  }

  function resumeVoice() {
    window.speechSynthesis.resume();
  }

  function stopVoice() {
    window.speechSynthesis.cancel();
  }
</script>

</body>
</html>
