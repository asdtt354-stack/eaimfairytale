<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>뮤니의 동화마을 이야기</title>
  <!-- PDF 변환 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; 
      margin: 0;
      padding: 8px 10px;
      background: linear-gradient(135deg, #fff9e6 0%, #e0f2fe 50%, #fce7f3 100%); 
      background-attachment: fixed;
      color: #334155; 
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    
    .card { 
      width: 100%;
      max-width: 640px;
      background: rgba(255, 255, 255, 0.96); 
      backdrop-filter: blur(12px);
      padding: 10px 16px 20px 16px; /* 상단 여백 대폭 축소 */
      border-radius: 24px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
      border: 2px solid #fef3c7;
      margin: 0 auto;
    }

    /* 🎵 상하 여백을 완벽하게 밀착시킨 뮤니 헤더 */
    .muni-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 0 6px 0;
      text-align: center;
    }

    /* 이미지 자체의 상하 투명 여백을 크롭하여 밀착 */
    .muni-full-banner-wrap {
      width: 100%;
      max-width: 420px;
      height: 140px; /* 로고 프레임 높이 압축 */
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin: -6px auto -4px auto;
    }

    .muni-full-banner {
      width: 100%;
      height: auto;
      display: block;
      transform: scale(1.35); /* 원본 상하 여백 잘라내고 캐릭터/글자 확대 */
      transform-origin: center center;
    }

    .muni-subtitle {
      font-size: 13px;
      color: #7c3aed;
      font-weight: 700;
      margin: 0 0 8px 0;
      letter-spacing: -0.3px;
    }
    
    .tab-nav { 
      display: flex; 
      gap: 6px; 
      margin-bottom: 14px;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 14px;
    }
    .tab-btn { 
      flex: 1; 
      padding: 10px; 
      background: transparent; 
      border: none; 
      font-size: 14px; 
      font-weight: 700; 
      color: #64748b; 
      cursor: pointer; 
      border-radius: 10px; 
      transition: all 0.2s ease;
    }
    .tab-btn.active { 
      background: #ffffff; 
      color: #6366f1; 
      box-shadow: 0 3px 10px rgba(0,0,0,0.06); 
    }

    .user-profile-box { 
      background: #f8fafc; 
      border: 1.5px dashed #cbd5e1; 
      padding: 12px 14px; 
      border-radius: 14px; 
      margin-bottom: 14px; 
    }
    .user-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .user-header label { color: #4f46e5; font-weight: 700; font-size: 13.5px; }
    .user-actions { display: flex; gap: 6px; align-items: center; }
    .user-status { font-size: 12px; color: #10b981; font-weight: bold; display: none; }
    .btn-small { background: #6366f1; color: white; border: none; padding: 4px 8px; border-radius: 6px; font-size: 11.5px; cursor: pointer; font-weight: 600; }
    .btn-clear { background: none; border: none; color: #ef4444; font-size: 11.5px; cursor: pointer; text-decoration: underline; }
    
    .helper-text { font-size: 12px; color: #64748b; margin-top: 4px; line-height: 1.4; }
    .helper-alert { color: #4f46e5; font-weight: 600; }

    .input-group { margin-bottom: 14px; }
    label { display: block; font-weight: 700; margin-bottom: 4px; font-size: 13.5px; color: #334155; }
    input, select { 
      width: 100%; 
      padding: 11px 13px; 
      border: 1.5px solid #e2e8f0; 
      border-radius: 12px; 
      font-size: 14.5px; 
      background: #ffffff; 
      transition: all 0.2s;
    }
    input:focus, select:focus { 
      outline: none; 
      border-color: #6366f1; 
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12); 
    }
    
    .photo-upload-box {
      background: #fffbeb;
      border: 2px dashed #fcd34d;
      border-radius: 14px;
      padding: 12px;
      text-align: center;
      margin-bottom: 14px;
    }
    .photo-preview-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 6px;
    }
    .photo-preview-img {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #f59e0b;
      display: none;
    }
    .photo-btn {
      background: #f59e0b;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .photo-clear-btn {
      background: #fee2e2;
      color: #991b1b;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      display: none;
    }

    button.primary-btn { 
      width: 100%; 
      padding: 15px; 
      background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%); 
      color: white; 
      border: none; 
      border-radius: 14px; 
      font-size: 16px; 
      font-weight: 800; 
      cursor: pointer; 
      margin-top: 6px; 
      box-shadow: 0 6px 18px rgba(99, 102, 241, 0.3);
      touch-action: manipulation;
    }
    button.primary-btn:active { transform: scale(0.98); }
    
    #status-log { margin-top: 12px; font-size: 14px; color: #4f46e5; text-align: center; font-weight: 700; }
    
    #book-container { margin-top: 18px; display: none; }
    .story-title { font-size: 19px; font-weight: 800; color: #1e293b; text-align: center; margin-bottom: 12px; }
    
    .book-page-wrapper { width: 100%; position: relative; }
    .page-item { display: none; position: relative; width: 100%; aspect-ratio: 1/1; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.12); animation: fadeIn 0.3s ease-in-out; background: #e2e8f0; border: 3px solid #ffffff; }
    .page-item.active { display: block; }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    .page-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .page-loading-text { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; font-size: 15px; color: #64748b; font-weight: 700; }

    .page-overlay-box { 
      position: absolute; 
      bottom: 0; 
      left: 0; 
      width: 100%; 
      background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.65) 75%, rgba(0,0,0,0) 100%); 
      padding: 30px 14px 14px 14px; 
      backdrop-filter: blur(4px); 
      -webkit-backdrop-filter: blur(4px); 
      max-height: 55%;
      overflow-y: auto;
    }
    .page-text { font-size: 14.5px; line-height: 1.7; color: #ffffff; text-align: left; word-break: keep-all; margin: 0; text-shadow: 0 2px 4px rgba(0,0,0,0.7); font-weight: 500; }
    .page-num-badge { display: inline-block; background: rgba(251, 191, 36, 0.95); color: #78350f; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 800; margin-bottom: 6px; }

    .dialogue-char { font-weight: 800; margin-right: 4px; }
    .dialogue-hero { color: #93c5fd; }
    .dialogue-villain { color: #f87171; }
    .dialogue-elder { color: #fde047; }
    .emotion-tag { font-size: 11px; padding: 1px 5px; border-radius: 4px; background: rgba(255,255,255,0.2); color: #fff; margin-left: 4px; font-weight: normal; }

    .page-nav-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; background: #f8fafc; padding: 10px 14px; border-radius: 12px; border: 1.5px solid #e2e8f0; }
    .page-nav-btn { background: #3b82f6; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .page-nav-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
    .page-indicator { font-size: 13.5px; font-weight: 800; color: #475569; }

    .drama-control-box {
      margin-top: 12px;
      background: #eff6ff;
      border: 1.5px solid #bfdbfe;
      padding: 10px 12px;
      border-radius: 12px;
    }
    .drama-control-box label { color: #1e40af; font-size: 13px; margin-bottom: 4px; }

    .controls { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .controls button { flex: 1 1 calc(50% - 4px); padding: 11px 6px; background: #e2e8f0; border: none; border-radius: 10px; font-size: 13px; cursor: pointer; font-weight: 700; color: #334155; }
    .controls button.read-btn { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; flex: 1 1 100%; font-size: 15px; padding: 12px; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25); }
    
    .controls button.loop-btn { background: #f1f5f9; color: #475569; border: 1.5px solid #cbd5e1; }
    .controls button.loop-btn.active { background: #8b5cf6; color: white; border-color: #7c3aed; font-weight: 800; }
    
    .controls button.save-btn { background: #6366f1; color: white; }
    .controls button.pdf-btn { background: #f59e0b; color: white; }
    .controls button.stop { background: #fee2e2; color: #991b1b; }

    .library-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .library-play-all { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
    .library-item { display: flex; justify-content: space-between; align-items: center; padding: 11px 13px; background: #ffffff; border: 1.5px solid #e2e8f0; border-radius: 12px; margin-bottom: 8px; }
    .library-info { flex: 1; text-align: left; }
    .library-info h4 { margin: 0 0 3px 0; color: #1e293b; font-size: 14.5px; font-weight: 700; }
    .library-info p { margin: 0; font-size: 11.5px; color: #64748b; }
    .library-actions { display: flex; gap: 6px; }
    .library-actions button { padding: 6px 10px; font-size: 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: 700; }
    .btn-load { background: #6366f1; color: white; }
    .btn-delete { background: #ef4444; color: white; }
  </style>
</head>
<body>

<div class="card">
  <!-- 🎵 위아래 여백을 콤팩트하게 밀착시킨 헤더 -->
  <div class="muni-header">
    <div class="muni-full-banner-wrap">
      <img src="muni_title.jpg" class="muni-full-banner" alt="뮤니의 동화마을 이야기" onerror="this.src='muni_title.png'; this.onerror=function(){this.src='muni.png';};">
    </div>
    <div class="muni-subtitle">음악과 함께하는 나만의 입체 오디오 동화 공작소</div>
  </div>

  <div class="tab-nav">
    <button class="tab-btn active" id="tabCreateBtn" onclick="switchTab('create')">✨ 새 동화 만들기</button>
    <button class="tab-btn" id="tabLibraryBtn" onclick="switchTab('library')">📚 내 서재 보관함</button>
  </div>

  <!-- 1. 제작 탭 -->
  <div id="create-view">
    <div class="user-profile-box">
      <div class="user-header">
        <label for="apiKey">🔑 API Key & 내 서재 닉네임</label>
        <div class="user-actions">
          <span class="user-status" id="apiStatus">💾 저장됨</span>
          <button class="btn-small" onclick="saveUserSession()">설정 저장</button>
          <button class="btn-clear" onclick="clearUserSession()">초기화</button>
        </div>
      </div>
      <input type="password" id="apiKey" placeholder="Google AI Studio API 키를 입력하세요" oninput="saveUserSession()" style="margin-bottom: 6px;">
      
      <label for="authorName" style="font-size: 12.5px; color: #334155; margin-top: 4px;">✍️ 책 저장을 위한 작가 닉네임 (필수)</label>
      <input type="text" id="authorName" placeholder="책 저장을 위해 닉네임을 적어주세요 (예: 민우 작가, 3학년 2반)" oninput="saveUserSession()">
      <div class="helper-text">
        <span class="helper-alert">💡 안내:</span> 같은 기기나 API 키를 함께 써도, <b>닉네임(이름)</b>을 적어주시면 나만의 서재에 따로 안전하게 보관됩니다.
      </div>
    </div>

    <!-- 📸 어린이 얼굴 사진 업로드 -->
    <div class="photo-upload-box">
      <label style="color: #92400e; margin-bottom: 3px;">🧒 주인공 얼굴 사진 넣기 (선택)</label>
      <p style="margin: 0 0 6px 0; font-size: 12px; color: #b45309;">아이 사진을 넣으면 동화 속 캐릭터로 쏙 들어갑니다!</p>
      <input type="file" id="childPhotoInput" accept="image/*" style="display: none;" onchange="handlePhotoUpload(event)">
      <div class="photo-preview-wrapper">
        <img id="photoPreview" class="photo-preview-img" alt="아이 사진">
        <button type="button" class="photo-btn" onclick="document.getElementById('childPhotoInput').click()">📷 사진 선택하기</button>
        <button type="button" id="photoClearBtn" class="photo-clear-btn" onclick="clearChildPhoto()">지우기</button>
      </div>
    </div>

    <!-- 🎭 장르 선택 -->
    <div class="input-group">
      <label for="storyGenre">🎨 동화 장르 / 이야기 스타일</label>
      <select id="storyGenre">
        <option value="fantasy" selected>✨ 환상 판타지 / 요정 이야기 (마법, 신비로운 모험)</option>
        <option value="heroic">⚔️ 영웅 & 신화 / 성경 / 역사 모험 (용기와 믿음의 대결)</option>
        <option value="mystery">🔍 흥미진진 추리 & 비밀 탐험 (지혜로운 수수께끼 풀기)</option>
        <option value="scifi">🚀 우주 & 미래 SF 과학 탐험 (로봇, 별자리, 시간여행)</option>
        <option value="animal">🐾 따뜻한 동물 친구들 & 일상 교훈 (숲속 우정과 배려)</option>
        <option value="comic">😂 유쾌하고 웃긴 코믹 모험 (엉뚱하고 재미있는 소동)</option>
        <option value="custom">🌈 기타 / 자유 장르 (주제에 맞춘 창의적 자유 연출)</option>
      </select>
    </div>
    
    <div class="input-group">
      <label>🐰 등장인물 / 주인공 이름</label>
      <input type="text" id="character" value="용감한 양치기 소년 다윗과 거인 골리앗">
    </div>
    <div class="input-group">
      <label>🏰 배경</label>
      <input type="text" id="background" value="고대 엘라 골짜기 전장">
    </div>
    <div class="input-group">
      <label>💡 교훈 / 주제</label>
      <input type="text" id="lesson" value="겉모습보다 강한 용기와 믿음의 승리">
    </div>
    
    <div class="input-group">
      <label for="storyLength">⏱ 동화 구연 시간을 선택해주세요</label>
      <select id="storyLength">
        <option value="2">2분 동화 (약 4페이지 - 속도감 있는 역할극)</option>
        <option value="3" selected>3분 동화 (약 6페이지 - 대화가 풍성한 오디오 드라마)</option>
        <option value="5">5분 동화 (약 8페이지 - 깊이 있는 모험 서사극)</option>
        <option value="10">10분 동화 (약 10페이지 - 장편 입체 낭독극)</option>
      </select>
      <div class="helper-text">💡 원하는 낭독 길이에 맞춰 이야기와 삽화 페이지 수를 조절합니다.</div>
    </div>

    <button class="primary-btn" id="generateBtn" onclick="generateStoryAndImages()">🎭 뮤니와 함께 동화책 만들기</button>
    <div id="status-log"></div>
  </div>

  <!-- 2. 서재 탭 -->
  <div id="library-view" style="display: none;">
    <div class="library-header">
      <span id="libraryTitleLabel" style="font-weight: 700; color: #475569; font-size: 14.5px;">📚 나의 동화책 보관함</span>
      <button class="library-play-all" onclick="playAllBooksSequentially()">▶ 내 서재 연속 재생</button>
    </div>
    <div id="library-list">
      <p style="text-align: center; color: #94a3b8; padding: 20px;">저장된 동화책이 없습니다.</p>
    </div>
  </div>

  <!-- 3. 동화책 뷰어 -->
  <div id="book-container">
    <div class="story-title" id="story-main-title"></div>
    <div class="book-page-wrapper" id="story-pages-wrapper"></div>

    <div class="page-nav-bar">
      <button class="page-nav-btn" id="prevPageBtn" onclick="goToPrevPage()">◀ 이전 페이지</button>
      <span class="page-indicator" id="pageIndicator">1 / 1</span>
      <button class="page-nav-btn" id="nextPageBtn" onclick="goToNextPage()">다음 페이지 ▶</button>
    </div>

    <div class="drama-control-box">
      <label for="actingStyle">🎙️ 낭독 연기 스타일</label>
      <select id="actingStyle">
        <option value="dynamic_theater" selected>🔥 활기찬 다이내믹 극장 모드 (생생한 감정 연기 & 빠른 템포)</option>
        <option value="bedtime_calm">🌙 잔잔한 베드타임 모드 (편안하고 포근한 수면 톤)</option>
      </select>
    </div>
  </div>
  
  <!-- 4. 컨트롤 패널 -->
  <div class="controls" id="controlPanel" style="display: none;">
    <button class="read-btn" id="readBtn" onclick="startContinuousReading()">📢 다역 입체 낭독 시작</button>
    <button class="loop-btn" id="loopBtn" onclick="toggleRepeatMode()">🔁 반복 재생: OFF</button>
    <button onclick="pauseVoice()">⏸ 일시정지</button>
    <button onclick="resumeVoice()">▶ 이어듣기</button>
    <button class="stop" onclick="stopVoice()">⏹ 정지</button>
    <button class="save-btn" onclick="saveCurrentStoryToDB()">💾 내 서재에 저장</button>
    <button class="pdf-btn" onclick="exportToPDF()">📄 PDF 다운로드</button>
  </div>
</div>

<script>
  let currentStoryBookObject = null;
  let db;
  let isPlaying = false;
  let isRepeatMode = false;
  let isLibraryPlayingMode = false;
  let myLibraryBooks = [];
  let currentLibraryIndex = 0;
  let currentPageIndex = 0;

  let childPhotoBase64 = null;
  let childPhotoMime = "image/jpeg";

  let availableVoices = [];
  function initVoices() {
    availableVoices = window.speechSynthesis.getVoices();
  }
  if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = initVoices;
  }
  initVoices();

  function getUniqueUserIdentifier() {
    const key = document.getElementById('apiKey').value.trim();
    const author = document.getElementById('authorName').value.trim();
    
    if (key.length >= 8) {
      return (author ? author + "_" : "user_") + key.slice(-8);
    }
    return author ? author : "default_guest";
  }

  function saveUserSession() {
    const key = document.getElementById('apiKey').value.trim();
    const author = document.getElementById('authorName').value.trim();
    
    try {
      localStorage.setItem("gemini_fairytale_api_key", key);
      localStorage.setItem("gemini_fairytale_author", author);
    } catch(e) {}

    const status = document.getElementById('apiStatus');
    status.style.display = 'inline';
    setTimeout(() => { status.style.display = 'none'; }, 1500);

    loadLibraryList();
  }

  function clearUserSession() {
    try {
      localStorage.removeItem("gemini_fairytale_api_key");
      localStorage.removeItem("gemini_fairytale_author");
    } catch(e) {}
    document.getElementById('apiKey').value = '';
    document.getElementById('authorName').value = '';
    loadLibraryList();
    alert('사용자 정보가 초기화되었습니다.');
  }

  const dbRequest = indexedDB.open("FairytaleAppDB_MultiUser", 3);

  function handlePhotoUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    childPhotoMime = file.type || "image/jpeg";
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const maxDim = 512;
        let w = img.width, h = img.height;
        if (w > h && w > maxDim) { h *= maxDim / w; w = maxDim; }
        else if (h > maxDim) { w *= maxDim / h; h = maxDim; }
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);

        const dataUrl = canvas.toDataURL(childPhotoMime, 0.85);
        childPhotoBase64 = dataUrl.split(',')[1];

        const preview = document.getElementById('photoPreview');
        preview.src = dataUrl;
        preview.style.display = 'block';
        document.getElementById('photoClearBtn').style.display = 'inline-block';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  async function generateGeminiImage(apiKey, prompt, inputImageBase64 = null) {
    const parts = [];

    if (inputImageBase64) {
      parts.push({
        inlineData: {
          mimeType: childPhotoMime,
          data: inputImageBase64
        }
      });
      parts.push({
        text: `Create a children's book illustration where the main character has the exact facial appearance, hairstyle, and likeness of the child in the provided image. Scene description: ${prompt}`
      });
    } else {
      parts.push({
        text: `Children's storybook illustration: ${prompt}`
      });
    }

    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image:generateContent?key=${apiKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts: parts }] })
    });

    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const resParts = data.candidates?.[0]?.content?.parts || [];
    for (const part of resParts) {
      if (part.inlineData && part.inlineData.data) return part.inlineData.data;
    }
    throw new Error('이미지 없음');
  }

  function renderBookPages(book) {
    const wrapper = document.getElementById('story-pages-wrapper');
    wrapper.innerHTML = '';

    book.pages.forEach((p, i) => {
      const pageDiv = document.createElement('div');
      pageDiv.className = `page-item ${i === 0 ? 'active' : ''}`;
      pageDiv.id = `book-page-${i}`;
      
      const imgHtml = p.imageBase64 
        ? `<img src="data:image/png;base64,${p.imageBase64}" class="page-img" alt="삽화 ${p.page_num}">` 
        : `<div class="page-loading-text">🎨 (삽화 준비 중)</div>`;

      const formattedText = p.dialogue_list 
        ? p.dialogue_list.map(d => {
            let icon = '📖';
            let roleClass = '';
            if (d.role === 'hero' || d.role === 'child') { icon = '🧒'; roleClass = 'dialogue-hero'; }
            else if (d.role === 'villain' || d.role === 'monster') { icon = '👹'; roleClass = 'dialogue-villain'; }
            else if (d.role === 'elder') { icon = '🧙‍♂️'; roleClass = 'dialogue-elder'; }
            else if (d.role === 'friend') { icon = '🐾'; roleClass = 'dialogue-hero'; }

            let emotionBadge = '';
            if (d.emotion === 'excited') emotionBadge = '<span class="emotion-tag">✨ 신남</span>';
            else if (d.emotion === 'urgent') emotionBadge = '<span class="emotion-tag">🔥 긴박</span>';
            else if (d.emotion === 'angry') emotionBadge = '<span class="emotion-tag">💥 호통</span>';
            else if (d.emotion === 'whisper') emotionBadge = '<span class="emotion-tag">🤫 속삭임</span>';

            if (d.role === 'narrator') {
              return `${d.text}<br>`;
            } else {
              return `<span class="dialogue-char ${roleClass}">${icon}</span> "${d.text}" ${emotionBadge}<br>`;
            }
          }).join('')
        : p.full_text;

      pageDiv.innerHTML = `
        ${imgHtml}
        <div class="page-overlay-box">
          <div class="page-num-badge">${p.page_num}페이지</div>
          <p class="page-text">${formattedText}</p>
        </div>
      `;
      wrapper.appendChild(pageDiv);
    });

    document.getElementById('story-main-title').innerText = `📖 ${book.title}`;
    document.getElementById('book-container').style.display = 'block';
    document.getElementById('controlPanel').style.display = 'flex';
  }

  function showPage(index) {
    if (!currentStoryBookObject || !currentStoryBookObject.pages.length) return;
    
    const total = currentStoryBookObject.pages.length;
    if (index < 0) index = 0;
    if (index >= total) index = total - 1;
    
    currentPageIndex = index;

    document.querySelectorAll('.page-item').forEach((el, i) => {
      if (i === currentPageIndex) el.classList.add('active');
      else el.classList.remove('active');
    });

    document.getElementById('pageIndicator').innerText = `${currentPageIndex + 1} / ${total}`;
    document.getElementById('prevPageBtn').disabled = (currentPageIndex === 0);
    document.getElementById('nextPageBtn').disabled = (currentPageIndex === total - 1);
  }

  function goToPrevPage() { showPage(currentPageIndex - 1); }
  function goToNextPage() { showPage(currentPageIndex + 1); }

  async function startContinuousReading(onCompleteCallback = null) {
    if (!currentStoryBookObject) return;
    stopVoice();
    isPlaying = true;

    showPage(0);
    await speakDynamicLine('narrator', 'excited', `제목: ${currentStoryBookObject.title}`);

    for (let i = 0; i < currentStoryBookObject.pages.length; i++) {
      if (!isPlaying) break;
      showPage(i);
      
      const pageData = currentStoryBookObject.pages[i];

      if (pageData.dialogue_list && pageData.dialogue_list.length > 0) {
        for (const line of pageData.dialogue_list) {
          if (!isPlaying) break;
          await speakDynamicLine(line.role || 'narrator', line.emotion || 'calm', line.text);
          const delay = line.emotion === 'urgent' ? 60 : 120;
          await new Promise(r => setTimeout(r, delay));
        }
      } else {
        await speakDynamicLine('narrator', 'calm', pageData.full_text);
      }
    }

    if (isPlaying) {
      if (onCompleteCallback && typeof onCompleteCallback === 'function') {
        onCompleteCallback();
      } else if (isRepeatMode) {
        setTimeout(() => {
          if (isPlaying && isRepeatMode) {
            startContinuousReading();
          }
        }, 1500);
      } else {
        isPlaying = false;
      }
    }
  }

  function speakDynamicLine(role, emotion, rawText) {
    return new Promise((resolve) => {
      const cleanText = rawText.replace(/[*#"]/g, '').trim();
      if (!cleanText) return resolve();

      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'ko-KR';

      const styleMode = document.getElementById('actingStyle').value;

      if (availableVoices.length === 0) initVoices();
      const koVoices = availableVoices.filter(v => v.lang.startsWith('ko'));
      const maleVoice = koVoices.find(v => v.name.includes('Male') || v.name.includes('남성') || v.name.includes('Minho') || v.name.includes('Standard-C'));
      const femaleVoice = koVoices.find(v => v.name.includes('Female') || v.name.includes('여성') || v.name.includes('Yuna') || v.name.includes('Sora') || v.name.includes('Google'));

      const r = (role || '').toLowerCase();
      const em = (emotion || '').toLowerCase();

      let rate = 1.0;
      let pitch = 1.0;

      if (styleMode === 'dynamic_theater') {
        if (r.includes('hero') || r.includes('child') || r.includes('friend')) {
          if (femaleVoice) utterance.voice = femaleVoice;
          if (em === 'excited' || em === 'happy') { rate = 1.18; pitch = 1.22; }
          else if (em === 'urgent') { rate = 1.25; pitch = 1.15; }
          else if (em === 'whisper') { rate = 0.88; pitch = 1.05; }
          else { rate = 1.10; pitch = 1.15; }
        } 
        else if (r.includes('villain') || r.includes('monster') || r.includes('giant')) {
          if (maleVoice) utterance.voice = maleVoice;
          if (em === 'angry') { rate = 1.05; pitch = 0.78; }
          else { rate = 0.95; pitch = 0.82; }
        } 
        else if (r.includes('elder') || r.includes('king')) {
          if (maleVoice) utterance.voice = maleVoice;
          rate = 0.95; pitch = 0.90;
        } 
        else {
          if (femaleVoice) utterance.voice = femaleVoice;
          if (em === 'excited' || em === 'happy') { rate = 1.12; pitch = 1.10; }
          else if (em === 'urgent') { rate = 1.18; pitch = 1.08; }
          else { rate = 1.05; pitch = 1.05; }
        }
      } else {
        rate = 0.88; pitch = 1.0;
        if (r.includes('villain') || r.includes('elder')) {
          if (maleVoice) utterance.voice = maleVoice;
        } else {
          if (femaleVoice) utterance.voice = femaleVoice;
        }
      }

      utterance.rate = rate;
      utterance.pitch = pitch;

      utterance.onend = () => resolve();
      utterance.onerror = () => resolve();

      window.speechSynthesis.speak(utterance);
    });
  }

      return;

  function playNextBookInLibrary() {
    if (!isPlaying && currentLibraryIndex > 0) return;

    if (currentLibraryIndex >= myLibraryBooks.length) {
      if (isRepeatMode) {
        currentLibraryIndex = 0;
      } else {
        alert('📚 내 서재의 모든 동화책 연속 재생이 완료되었습니다!');
        isLibraryPlayingMode = false;
        isPlaying = false;
        return;
      }
    }

    const nextBook = myLibraryBooks[currentLibraryIndex];
    currentStoryBookObject = nextBook;
    renderBookPages(nextBook);
    showPage(0);
    switchTab('create');

    setTimeout(() => {
      startContinuousReading(() => {
        currentLibraryIndex++;
        playNextBookInLibrary();
      });
    }, 1000);

  function loadLibraryList() {
    if (!db) return;
    const currentUserId = getUniqueUserIdentifier();
    const authorName = document.getElementById('authorName').value.trim() || "나";
    
    document.getElementById('libraryTitleLabel').innerText = `📚 [${authorName}] 작가님의 서재`;

    const tx = db.transaction("books", "readonly");
    const store = tx.objectStore("books");
    const req = store.getAll();
    const listEl = document.getElementById("library-list");

    req.onsuccess = () => {
      const allBooks = req.result;
      myLibraryBooks = allBooks.filter(book => book.userId === currentUserId || !book.userId);

      if (myLibraryBooks.length === 0) {
        listEl.innerHTML = `<p style="text-align: center; color: #94a3b8; padding: 20px;">[${authorName}] 님의 서재에 보관된 동화책이 없습니다.</p>`;
        return;
      }

      listEl.innerHTML = myLibraryBooks.map((book) => `
        <div class="library-item">
          <div class="library-info">
            <h4>📖 ${book.title}</h4>
            <p>작가: <b>${book.author || '익명'}</b> | 저장일: ${book.createdAt} (총 ${book.pages.length}p)</p>
          </div>
          <div class="library-actions">
            <button class="btn-load" onclick="loadSingleBook(${book.id})">열기</button>
            <button class="btn-delete" onclick="deleteSavedBook(${book.id})">삭제</button>
          </div>
        </div>
      `).join('');
    };
  }

  function loadSingleBook(id) {
    const tx = db.transaction("books", "readonly");
    const req = tx.objectStore("books").get(id);
    req.onsuccess = () => {
      const book = req.result;
      currentStoryBookObject = book;
      renderBookPages(book);
      showPage(0);
      switchTab('create');

  function deleteSavedBook(id) {

    const tx = db.transaction("books", "readwrite");
    tx.objectStore("books").delete(id);

    const printContainer = document.createElement('div');
    printContainer.innerHTML = `
      <h1 style="text-align:center; font-size:24px; margin-bottom:6px; color:#1e293b;">📖 ${currentStoryBookObject.title}</h1>
      <p style="text-align:center; font-size:14px; color:#64748b; margin-bottom:24px;">글/그림: ${currentStoryBookObject.author || '어린이 작가'}</p>
    `;
    
    currentStoryBookObject.pages.forEach(p => {
      const pDiv = document.createElement('div');
      pDiv.style.cssText = "page-break-inside: avoid; position: relative; width: 100%; max-width: 520px; aspect-ratio: 1/1; margin: 0 auto 30px auto; border-radius: 12px; overflow: hidden;";
      const imgTag = p.imageBase64 ? `<img src="data:image/png;base64,${p.imageBase64}" style="width: 100%; height: 100%; object-fit: cover;">` : '';
      pDiv.innerHTML = `
        ${imgTag}
        <div style="position: absolute; bottom: 0; left: 0; width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.65); padding: 20px 16px; color: #fff;">
          <b style="color: #fbbf24;">[${p.page_num}페이지]</b>
          <p style="font-size: 14px; line-height: 1.6; margin: 4px 0 0 0; color: #fff;">${p.full_text || p.text}</p>
        </div>
      `;
      printContainer.appendChild(pDiv);
    });

    const opt = {
      margin: 10,
      filename: `${currentStoryBookObject.title}_${currentStoryBookObject.author || '동화'}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };
    html2pdf().set(opt).from(printContainer).save();
  }

  function switchTab(tab) {
    document.getElementById('create-view').style.display = tab === 'create' ? 'block' : 'none';
    document.getElementById('library-view').style.display = tab === 'library' ? 'block' : 'none';
    document.getElementById('tabCreateBtn').className = `tab-btn ${tab === 'create' ? 'active' : ''}`;
    document.getElementById('tabLibraryBtn').className = `tab-btn ${tab === 'library' ? 'active' : ''}`;
    if (tab === 'library') loadLibraryList();
  }

  function pauseVoice() { window.speechSynthesis.pause(); }
  function resumeVoice() { window.speechSynthesis.resume(); }
  function stopVoice() {
    isPlaying = false;
    isLibraryPlayingMode = false;
    window.speechSynthesis.cancel();
  }
</script>

</body>
</html>
