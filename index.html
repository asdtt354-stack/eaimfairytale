<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>나만의 동화책 제작</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 680px; margin: 30px auto; padding: 20px; background: #f0f4f8; color: #333; }
    .card { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
    h2 { margin-top: 0; color: #2c3e50; font-size: 22px; text-align: center; }
    
    .api-key-box { background: #eef2ff; border: 1px solid #c7d2fe; padding: 14px; border-radius: 10px; margin-bottom: 20px; }
    .api-key-box label { color: #3730a3; font-weight: bold; }
    
    .input-group { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
    input, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; background: white; }
    input:focus, select:focus { outline: none; border-color: #6366f1; }
    
    button.primary-btn { width: 100%; padding: 14px; background: #6366f1; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
    button.primary-btn:hover { background: #4f46e5; }
    button.primary-btn:disabled { background: #a5b4fc; cursor: not-allowed; }
    
    #status-log { margin-top: 15px; font-size: 14px; color: #6366f1; text-align: center; font-weight: 600; }
    
    #story-viewer { margin-top: 24px; }
    .story-title { font-size: 22px; font-weight: bold; color: #1e293b; text-align: center; margin-bottom: 20px; }
    
    .page-item { background: #fffbeb; border: 1px solid #fef3c7; border-radius: 14px; padding: 18px; margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .page-img-container { width: 100%; max-width: 420px; aspect-ratio: 1/1; background: #f3f4f6; border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid #e5e7eb; }
    .page-img { width: 100%; height: 100%; object-fit: cover; }
    .page-text { font-size: 16px; line-height: 1.85; color: #374151; text-align: left; word-break: keep-all; width: 100%; padding: 0 8px; box-sizing: border-box; }
    
    .controls { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .controls button { flex: 1; min-width: 100px; padding: 12px; background: #e5e7eb; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600; }
    .controls button.read-btn { background: #10b981; color: white; flex-basis: 100%; font-size: 15px; }
    .controls button.read-btn:hover { background: #059669; }
    .controls button.read-btn:disabled { background: #9ca3af; cursor: not-allowed; }
    .controls button.stop { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

<div class="card">
  <h2>📖 나만의 동화책 제작</h2>

  <div class="api-key-box">
    <label for="apiKey">🔑 API Key</label>
    <input type="password" id="apiKey" placeholder="API 키를 입력하세요" style="margin-top: 6px;">
  </div>
  
  <div class="input-group">
    <label>주인공</label>
    <input type="text" id="character" value="호기심 많은 아기 고양이 나비">
  </div>
  <div class="input-group">
    <label>배경</label>
    <input type="text" id="background" value="구름 위에 떠 있는 무지개 마을">
  </div>
  <div class="input-group">
    <label>교훈 / 주제</label>
    <input type="text" id="lesson" value="실수를 두려워하지 않고 다시 도전하는 용기">
  </div>
  
  <!-- 분량 선택 드롭다운 -->
  <div class="input-group">
    <label for="storyLength">⏱ 이야기 분량 (낭독 시간)</label>
    <select id="storyLength">
      <option value="2">2분 (약 4페이지 - 짧고 경쾌한 이야기)</option>
      <option value="3" selected>3분 (약 6페이지 - 기승전결이 풍부한 이야기)</option>
      <option value="5">5분 (약 8페이지 - 대화와 묘사가 풍부한 모험담)</option>
      <option value="10">10분 (약 10페이지 - 깊이 있는 장편 베드타임 스토리)</option>
    </select>
  </div>

  <button class="primary-btn" id="generateBtn" onclick="generateStoryAndImages()">🎨 동화 & 삽화 제작하기</button>
  <div id="status-log"></div>

  <div id="story-viewer"></div>
  
  <div class="controls">
    <button class="read-btn" id="readBtn" onclick="startStoryNarration()" disabled>📢 동화 낭독하기</button>
    <button onclick="pauseVoice()">⏸ 일시정지</button>
    <button onclick="resumeVoice()">▶ 이어듣기</button>
    <button class="stop" onclick="stopVoice()">⏹ 정지</button>
  </div>
</div>

<script>
  let currentStoryNarration = "";

  // 분량별 설정 매핑
  const lengthConfig = {
    "2": { pages: 4, charCountPerPage: "150~180자 (4~5문장)", totalDesc: "낭독 시 약 2분 소요" },
    "3": { pages: 6, charCountPerPage: "160~200자 (5~6문장)", totalDesc: "낭독 시 약 3분 소요" },
    "5": { pages: 8, charCountPerPage: "200~250자 (6~7문장)", totalDesc: "낭독 시 약 5분 소요" },
    "10": { pages: 10, charCountPerPage: "280~320자 (8~10문장)", totalDesc: "낭독 시 약 10분 소요" }
  };

  async function generateStoryAndImages() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const char = document.getElementById('character').value.trim();
    const bg = document.getElementById('background').value.trim();
    const lesson = document.getElementById('lesson').value.trim();
    const lengthVal = document.getElementById('storyLength').value;
    const btn = document.getElementById('generateBtn');
    const readBtn = document.getElementById('readBtn');
    const statusLog = document.getElementById('status-log');
    const viewer = document.getElementById('story-viewer');

    if (!apiKey) {
      alert('API 키를 입력해 주세요.');
      document.getElementById('apiKey').focus();
      return;
    }

    const config = lengthConfig[lengthVal];

    btn.disabled = true;
    readBtn.disabled = true;
    statusLog.innerText = `1/${config.pages + 1}. ${lengthVal}분 분량의 스토리를 깊이 있게 작성 중입니다...`;
    viewer.innerHTML = '';
    currentStoryNarration = "";
    stopVoice();

    const promptText = `
너는 유아/아동용 그림동화 전문 작가야.
아래 설정을 바탕으로 총 ${config.pages}개 장면에 걸친 ${lengthVal}분 분량(${config.totalDesc})의 풍성한 동화책 JSON 데이터를 만들어줘.

- 주인공: ${char}
- 배경: ${bg}
- 주제/교훈: ${lesson}

[작성 가이드라인]
1. 단순 요약이 아닌, 등장인물의 대화, 감정 표현, 구체적인 상황 묘사를 충분히 넣어줘.
2. 각 페이지(총 ${config.pages}페이지)당 한국어 본문 길이는 반드시 **${config.charCountPerPage}** 내외로 넉넉하게 작성해줘.
3. 아동용으로 친근하고 다정한 구어체('~했어요', '~했답니다')를 사용해.

[반드시 준수할 출력 규격: 순수 JSON만 출력]
{
  "title": "동화책 제목",
  "pages": [
    {
      "page_num": 1,
      "text": "1페이지 상세 본문...",
      "image_prompt": "1페이지 장면에 어울리는 구체적인 영문 프롬프트, cute soft watercolor children's book illustration style, bright, warm pastel colors"
    }
  ]
}
(총 ${config.pages}개의 객체가 pages 배열에 들어가야 함)
`;

    try {
      const geminiRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: promptText }] }],
          generationConfig: { responseMimeType: "application/json" }
        })
      });

      const geminiData = await geminiRes.json();
      if (geminiData.error) throw new Error(geminiData.error.message);

      const rawJson = geminiData.candidates[0].content.parts[0].text;
      const storyData = JSON.parse(rawJson);

      viewer.innerHTML = `<div class="story-title">📖 ${storyData.title}</div>`;
      currentStoryNarration = `${storyData.title}. `;

      for (let i = 0; i < storyData.pages.length; i++) {
        const page = storyData.pages[i];
        statusLog.innerText = `${i + 2}/${storyData.pages.length + 1}. ${page.page_num}페이지 삽화를 그리는 중입니다... (${i + 1}/${storyData.pages.length})`;

        const pageDiv = document.createElement('div');
        pageDiv.className = 'page-item';
        pageDiv.innerHTML = `
          <div class="page-img-container" id="img-container-${i}">
            <span>🎨 삽화 그리는 중...</span>
          </div>
          <div class="page-text"><b>${page.page_num}p.</b> ${page.text}</div>
        `;
        viewer.appendChild(pageDiv);
        currentStoryNarration += ` ${page.text}`;

        try {
          const imgBase64 = await generateGeminiImage(apiKey, page.image_prompt);
          const imgContainer = document.getElementById(`img-container-${i}`);
          imgContainer.innerHTML = `<img src="data:image/png;base64,${imgBase64}" class="page-img" alt="삽화 ${page.page_num}">`;
        } catch (imgErr) {
          console.error(`Page ${i+1} Image Error:`, imgErr);
          const imgContainer = document.getElementById(`img-container-${i}`);
          imgContainer.innerHTML = `<span>⚠️ 삽화 생성 실패</span>`;
        }
      }

      statusLog.innerText = '✅ 동화책이 완성되었습니다! 아래 [동화 낭독하기] 버튼을 눌러보세요.';
      readBtn.disabled = false;

    } catch (err) {
      statusLog.innerText = `⚠️ 오류: ${err.message}`;
    } finally {
      btn.disabled = false;
    }
  }

  async function generateGeminiImage(apiKey, prompt) {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image:generateContent?key=${apiKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{
          parts: [{ text: `Children's storybook illustration: ${prompt}` }]
        }]
      })
    });

    const data = await res.json();
    if (data.error) throw new Error(data.error.message);

    const parts = data.candidates?.[0]?.content?.parts || [];
    for (const part of parts) {
      if (part.inlineData && part.inlineData.data) {
        return part.inlineData.data;
      }
    }

    throw new Error('이미지 데이터가 없습니다.');
  }

  function startStoryNarration() {
    if (!currentStoryNarration) return;
    speakStory(currentStoryNarration);
  }

  function speakStory(text) {
    window.speechSynthesis.cancel();
    const cleanText = text.replace(/[*#]/g, '');
    const utterance = new SpeechSynthesisUtterance(cleanText);
    utterance.lang = 'ko-KR';
    utterance.rate = 0.88;
    utterance.pitch = 1.1;

    window.speechSynthesis.speak(utterance);
  }

  function pauseVoice() { window.speechSynthesis.pause(); }
  function resumeVoice() { window.speechSynthesis.resume(); }
  function stopVoice() { window.speechSynthesis.cancel(); }
</script>

</body>
</html>
